<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>大掌櫃工具箱 - 主選單完整版</title>
    <style>
        /* 基礎轉場效果 */
        .transition-all { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        /* 極致黑主題適配 */
        .theme-dark { background-color: #0f172a !important; color: #f8fafc !important; }
        .theme-dark #announceBox { background-color: #1e293b !important; border-left: 8px solid #6366f1 !important; color: white !important; }
        .theme-dark #announceDisplay { color: #cbd5e1 !important; }
        .theme-dark h1, .theme-dark h2, .theme-dark h3, .theme-dark #userName { color: white !important; }
        
        /* 彈窗與卡片在深色模式下的底色修正 */
        .theme-dark .modal-content, .theme-dark .tool-card { background-color: #1e293b !important; border: 1px solid #334155 !important; color: white !important; }
        .theme-dark input, .theme-dark select, .theme-dark textarea { 
            background-color: #0f172a !important; color: white !important; border: 1px solid #475569 !important; 
        }
        .theme-dark .test-link { background-color: #334155 !important; color: white !important; border: 1px solid #475569 !important; }
        .theme-dark th { color: #94a3b8 !important; }

        /* 密碼眼睛與彈窗背景 */
        .pwd-container { position: relative; width: 100%; }
        .eye-icon { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8; font-size: 1.2rem; }
        .modal-backdrop { backdrop-filter: blur(12px); background-color: rgba(15, 23, 42, 0.85); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-12 transition-all" id="mainBody">
    <div class="max-w-4xl mx-auto">
        
        <div id="announceBox" class="hidden mb-8 bg-amber-50 border-l-8 border-amber-400 p-6 rounded-2xl shadow-sm">
            <div class="flex items-center gap-4">
                <span class="text-3xl">📢</span>
                <div>
                    <p class="text-[10px] font-bold text-amber-500 uppercase tracking-widest">System Announcement</p>
                    <p id="announceDisplay" class="font-black text-lg"></p>
                </div>
            </div>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 bg-white p-8 rounded-[2.5rem] shadow-sm gap-4 border border-slate-100 modal-content">
            <div>
                <h1 id="userName" class="text-3xl font-black text-slate-800 italic">載入中...</h1>
                <p id="userRole" class="text-blue-500 font-bold text-xs uppercase tracking-[0.2em] mt-1"></p>
            </div>
            <div class="flex gap-2">
                <button id="changePwdBtn" onclick="openModal('pwdModal')" class="hidden px-6 py-2 bg-indigo-50 text-indigo-600 rounded-xl font-bold hover:bg-indigo-100 transition text-sm">修改密碼</button>
                <button onclick="logout()" class="px-6 py-2 rounded-xl text-slate-300 font-bold hover:bg-red-50 hover:text-red-500 transition-all text-sm">安全登出</button>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mb-12">
            <button onclick="location.href='stamina.html'" class="tool-card bg-white p-8 rounded-[2.5rem] shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all text-left border-b-8 border-blue-500 group">
                <div class="text-3xl mb-3 group-hover:scale-125 transition-transform">⚡</div>
                <h3 class="font-bold text-slate-700 text-lg">體力監控</h3>
                <p class="text-slate-400 text-[10px] uppercase mt-1">Stamina Tracker</p>
            </button>
            <button onclick="location.href='flipping.html'" class="tool-card bg-white p-8 rounded-[2.5rem] shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all text-left border-b-8 border-red-500 group">
                <div class="text-3xl mb-3 group-hover:scale-125 transition-transform">🃏</div>
                <h3 class="font-bold text-slate-700 text-lg">翻牌工具</h3>
                <p class="text-slate-400 text-[10px] uppercase mt-1">Path Finder</p>
            </button>
            <button onclick="location.href='voyage.html'" class="tool-card bg-white p-8 rounded-[2.5rem] shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all text-left border-b-8 border-amber-500 group">
                <div class="text-3xl mb-3 group-hover:scale-125 transition-transform">🚢</div>
                <h3 class="font-bold text-slate-700 text-lg">偉大航線</h3>
                <p class="text-slate-400 text-[10px] uppercase mt-1">Voyage System</p>
            </button>
            <!-- 在原本的三個按鈕後面加上第四個 -->
            <button onclick="location.href='battle.html'" class="tool-card bg-white p-8 rounded-[2.5rem] shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all text-left border-b-8 border-purple-500 group">
                <div class="text-3xl mb-3 group-hover:scale-125 transition-transform">⚔️</div>
                <h3 class="font-bold text-slate-700 text-lg">對戰分析</h3>
                <p class="text-slate-400 text-[10px] uppercase mt-1">Battle Simulator</p>
             </button>

            <button onclick="location.href='exchange tool.html'" class="tool-card bg-white p-8 rounded-[2.5rem] shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all text-left border-b-8 border-green-500 group">
                <div class="text-3xl mb-3 group-hover:scale-125 transition-transform">💹</div>
                <h3 class="font-bold text-slate-700 text-lg">交引估值</h3>
                <p class="text-slate-400 text-[10px] uppercase mt-1">Exchange Tool</p>
             </button>
            
            <button onclick="location.href='toolkit.html'" class="tool-card bg-white p-8 rounded-[2.5rem] shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all text-left border-b-8 border-pink-500 group">
                <div class="text-3xl mb-3 group-hover:scale-125 transition-transform">🧰</div>
                <h3 class="font-bold text-slate-700 text-lg">教學與下載</h3>
                <p class="text-slate-400 text-[10px] uppercase mt-1">Toolkit Center</p>
            </button>
        </div>

        <div id="adminPanel" class="hidden p-8 bg-slate-900 rounded-[2.5rem] text-white shadow-2xl">
            <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.3em] mb-6">Administrator Console</h2>
            <div class="flex flex-wrap gap-4">
                <button id="configBtn" onclick="openConfigModal()" class="hidden bg-indigo-600 hover:bg-indigo-500 px-8 py-3 rounded-2xl text-sm font-bold shadow-lg transition-all">修改系統配置</button>
                <button id="userManageBtn" onclick="openUserModal()" class="hidden bg-slate-700 hover:bg-slate-600 px-8 py-3 rounded-2xl text-sm font-bold transition-all">用戶權限管理</button>
                <button id="testHubBtn" onclick="openModal('testListModal')" class="hidden bg-indigo-900 hover:bg-indigo-800 px-8 py-3 rounded-2xl text-sm font-bold border border-indigo-500 transition-all">🧪 測試實驗室</button>
            </div>
        </div>
    </div>

    <div id="userModal" class="fixed inset-0 modal-backdrop hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-4xl rounded-[3rem] p-8 shadow-2xl modal-content flex flex-col max-h-[85vh] relative">
            <button onclick="closeModal('userModal')" class="absolute top-8 right-8 text-slate-300 hover:text-slate-600 text-2xl font-bold">✕</button>
            <h3 class="text-2xl font-black mb-6">全體用戶權限清單</h3>
            <div class="overflow-x-auto flex-1 pr-2">
                <table class="w-full text-left">
                    <thead id="userTableHead" class="text-[10px] font-bold text-slate-400 border-b uppercase"></thead>
                    <tbody id="userTableBody" class="text-sm"></tbody>
                </table>
            </div>
            <button onclick="closeModal('userModal')" class="mt-6 w-full py-4 bg-slate-100 rounded-2xl font-bold text-slate-400">關閉</button>
        </div>
    </div>

    <div id="testListModal" class="fixed inset-0 modal-backdrop hidden items-center justify-center p-6 z-50">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl text-center modal-content relative">
            <button onclick="closeModal('testListModal')" class="absolute top-6 right-6 text-slate-300 hover:text-slate-600 text-2xl font-bold">✕</button>
            <h3 class="text-2xl font-black mb-6">測試實驗室</h3>
            <div class="space-y-3">
                <a href="test.html" class="block p-4 bg-slate-50 text-slate-700 rounded-2xl font-bold hover:bg-indigo-50 test-link">偉大航線 (test.html)</a>
                <a href="test2.html" class="block p-4 bg-slate-50 text-slate-700 rounded-2xl font-bold hover:bg-indigo-50 test-link">花牌 (test2.html)</a>
                <a href="test3.html" class="block p-4 bg-slate-50 text-slate-700 rounded-2xl font-bold hover:bg-indigo-50 test-link">體力監控 (test3.html)</a>
                <!-- 在原本的三個連結後面加上 -->
                <a href="test4.html" class="block p-4 bg-slate-50 text-slate-700 rounded-2xl font-bold hover:bg-indigo-50 test-link">對戰分析 (test4.html)</a>
                <a href="test5.html" class="block p-4 bg-slate-50 text-slate-700 rounded-2xl font-bold hover:bg-indigo-50 test-link">教學與下載 (test5.html)</a>
                <a href="test6.html" class="block p-4 bg-slate-50 text-slate-700 rounded-2xl font-bold hover:bg-indigo-50 test-link">交引分析 (test6.html)</a>
            </div>
        </div>
    </div>

    <div id="configModal" class="fixed inset-0 modal-backdrop hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl modal-content relative">
            <h3 class="text-2xl font-black mb-6 text-center">系統配置同步</h3>
            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase">公告內容</label>
                    <textarea id="announceInput" class="w-full border-2 border-slate-100 rounded-2xl p-4 text-sm focus:border-indigo-500 outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase">介面主題</label>
                    <select id="themeInput" class="w-full border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold bg-slate-50">
                        <option value="default">預設藍白</option>
                        <option value="christmas">聖誕紅</option>
                        <option value="dark">極致黑</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-4 mt-8">
                <button onclick="closeModal('configModal')" class="flex-1 py-4 text-slate-400 font-bold">取消</button>
                <button id="saveConfigBtn" onclick="saveConfig()" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-xl">儲存並同步</button>
            </div>
        </div>
    </div>

    <div id="pwdModal" class="fixed inset-0 modal-backdrop hidden items-center justify-center p-6 z-50">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl text-center modal-content">
            <h3 class="text-xl font-black mb-6">更新登入密碼</h3>
            <div class="space-y-4 mb-6">
                <div class="pwd-container text-left">
                    <input id="newPwd" type="password" placeholder="輸入新密碼" class="w-full p-4 border-2 border-slate-100 rounded-2xl font-bold outline-none">
                    <span class="eye-icon" onclick="togglePwd('newPwd', this)">ʕ￫ᴥ￩ʔ</span>
                </div>
                <div class="pwd-container text-left">
                    <input id="confirmPwd" type="password" placeholder="確認新密碼" class="w-full p-4 border-2 border-slate-100 rounded-2xl font-bold outline-none">
                    <span class="eye-icon" onclick="togglePwd('confirmPwd', this)">ʕ￫ᴥ￩ʔ</span>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="closeModal('pwdModal')" class="flex-1 py-4 bg-slate-100 text-slate-500 rounded-2xl font-bold">取消</button>
                <button id="submitPwdBtn" onclick="submitNewPwd()" class="flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-md">確認修改</button>
            </div>
        </div>
    </div>

    <div id="recoveryModal" class="fixed inset-0 modal-backdrop hidden items-center justify-center p-6 z-[60]">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-10 shadow-2xl text-center border-4 border-indigo-500 modal-content">
            <h3 class="text-2xl font-black mb-2">安全救援碼</h3>
            <p class="text-slate-400 font-bold mb-6 text-sm">請務必截圖保存，這是遺失密碼時唯一的找回手段！</p>
            <div id="recoveryDisplay" class="bg-slate-100 p-6 rounded-2xl text-3xl font-black text-indigo-600 tracking-widest mb-8 border-2 border-dashed border-indigo-200"></div>
            <button onclick="confirmRecovery()" class="w-full py-5 bg-indigo-600 text-white rounded-2xl font-black text-lg shadow-lg">我已妥善保存</button>
        </div>
    </div>

    <div id="msgModal" class="fixed inset-0 modal-backdrop hidden items-center justify-center p-6 z-[200]">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl text-center modal-content">
            <div id="msgIcon" class="text-4xl mb-4">✅</div>
            <h3 id="msgTitle" class="text-xl font-black mb-2 text-slate-800">提示</h3>
            <p id="msgText" class="text-slate-500 font-bold mb-6 text-sm"></p>
            <button onclick="closeModal('msgModal')" class="w-full py-4 bg-slate-800 text-white rounded-2xl font-black">我知道了</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxyC96mO15fHbbG11IVoWr7c_F63xAGYpYAhANVZGlmyCS43k-Gud26S5fmsIO-mBwy/exec"; 
        let cachedData = null;

        window.onload = function() {
            const data = JSON.parse(sessionStorage.getItem('gameData'));
            if(!data) return location.href = "index.html";
            cachedData = data;

            // 1. 初始化介面文字
            document.getElementById('userName').innerText = "掌櫃, " + data.user.name;
            document.getElementById('userRole').innerText = "Access Level: " + data.user.role;
            
            // 2. 初始化公告
            if(data.config && data.config.AnnounceText) {
                document.getElementById('announceBox').classList.remove('hidden');
                document.getElementById('announceDisplay').innerText = data.config.AnnounceText;
            }

            // 3. 套用主題
            if(data.config && data.config.CurrentTheme) applyTheme(data.config.CurrentTheme);

            // 4. 權限判斷
            const lv = parseInt(data.user.level);
            const role = data.user.role;

            // 針對 SuperAdmin 隱藏修改密碼按鈕
            if(role === "SuperAdmin") {
                document.getElementById('changePwdBtn').classList.add('hidden');
            } else if (role === "Test") {
                document.getElementById('changePwdBtn').classList.add('hidden');
                data.isNewRecovery = false;
            } else {
                document.getElementById('changePwdBtn').classList.remove('hidden');
            }

            // 管理面板顯示邏輯
            if(lv >= 10) {
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('userManageBtn').classList.remove('hidden');
                if(lv === 99) {
                    document.getElementById('configBtn').classList.remove('hidden');
                    document.getElementById('testHubBtn').classList.remove('hidden');
                }
            }

            // 5. 檢查是否顯示救援碼
            if(String(data.isNewRecovery) === "true") {
                document.getElementById('recoveryDisplay').innerText = data.recoveryCode;
                openModal('recoveryModal');
            }
        };

        // --- 功能函數區 ---

        async function saveConfig() {
            const btn = document.getElementById('saveConfigBtn');
            const announce = encodeURIComponent(document.getElementById('announceInput').value);
            const theme = document.getElementById('themeInput').value;
            btn.innerText = "寫入同步中..."; btn.disabled = true;

            try {
                const response = await fetch(`${SCRIPT_URL}?action=saveConfig&announce=${announce}&theme=${theme}`);
                const res = await response.json();
                if(res.success) {
                    showMsg("同步成功", "系統配置已寫回 Sheet。");
                    setTimeout(() => location.reload(), 2000);
                } else { showMsg("同步失敗", res.msg, false); }
            } catch(e) { showMsg("連線錯誤", "無法連上伺服器", false); }
            finally { btn.innerText = "儲存並同步"; btn.disabled = false; }
        }

        async function submitNewPwd() {
            const btn = document.getElementById('submitPwdBtn');
            const p1 = document.getElementById('newPwd').value;
            const p2 = document.getElementById('confirmPwd').value;

            if(!p1 || p1 !== p2) return showMsg("錯誤", "兩次密碼輸入不一致", false);
            btn.innerText = "更新中..."; btn.disabled = true;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=updatePassword&userId=${cachedData.user.userId}&newPassword=${encodeURIComponent(p1)}`);
                const result = await res.json();
                if(result.success) {
                    showMsg("成功", "密碼已更新，請牢記。");
                    closeModal('pwdModal');
                } else { showMsg("失敗", result.msg, false); }
            } catch(e) { showMsg("錯誤", "網路異常", false); }
            finally { btn.innerText = "確認修改"; btn.disabled = false; }
        }

        function openUserModal() {
            const lv = parseInt(cachedData.user.level);
            const thead = document.getElementById('userTableHead');
            const tbody = document.getElementById('userTableBody');

            // 動態表頭
            let headHtml = `<th class="pb-4">名稱</th><th class="pb-4">ID</th><th class="pb-4">角色</th><th class="pb-4">救援碼</th>`;
            if (lv === 99) headHtml += `<th class="pb-4">預設密碼</th>`;
            thead.innerHTML = `<tr>${headHtml}</tr>`;

            if(cachedData.allUsers) {
                tbody.innerHTML = cachedData.allUsers.map(u => {
                    let row = `
                        <tr class="border-b border-slate-50 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                            <td class="py-4 font-bold text-slate-700 dark:text-slate-200">${u.name}</td>
                            <td class="py-4 font-mono text-xs text-slate-400">${u.id}</td>
                            <td class="py-4 text-xs font-bold text-indigo-500">${u.role}</td>
                            <td class="py-4 text-xs font-mono font-black text-amber-600">${u.recovery || '---'}</td>
                    `;
                    if (lv === 99) row += `<td class="py-4 text-xs font-mono text-pink-500">${u.defaultPwd || '---'}</td>`;
                    return row + `</tr>`;
                }).join('');
            }
            openModal('userModal');
        }

        async function testLineNotify() {
            showMsg("測試中", "正在發送 Line Notify 請求...");
            try {
                const res = await fetch(`${SCRIPT_URL}?action=testLine`);
                const data = await res.json();
                showMsg(data.success ? "成功" : "失敗", data.msg, data.success);
            } catch(e) { showMsg("錯誤", "發送失敗", false); }
        }

        // --- 工具類函數 ---

        function applyTheme(theme) {
            const body = document.getElementById('mainBody');
            body.classList.remove('theme-dark');
            body.style.backgroundColor = ""; // 重置

            if(theme === 'dark') {
                body.classList.add('theme-dark');
            } else if(theme === 'christmas') {
                body.style.backgroundColor = "#fff1f2";
            } else {
                body.style.backgroundColor = "#f8fafc";
            }
        }

        function togglePwd(id, iconEl) {
            const el = document.getElementById(id);
            if (el.type === 'password') {
                el.type = 'text';
                iconEl.innerText = 'ʕ•ᴥ•ʔ';
            } else {
                el.type = 'password';
                iconEl.innerText = 'ʕ￫ᴥ￩ʔ';
            }
        }

        function showMsg(title, text, isSuccess = true) {
            document.getElementById('msgIcon').innerText = isSuccess ? "✅" : "❌";
            document.getElementById('msgTitle').innerText = title;
            document.getElementById('msgText').innerText = text;
            openModal('msgModal');
        }

        function openModal(id) { document.getElementById(id).classList.replace('hidden', 'flex'); }
        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }
        
        function openConfigModal() {
            document.getElementById('announceInput').value = cachedData.config.AnnounceText || "";
            document.getElementById('themeInput').value = cachedData.config.CurrentTheme || "default";
            openModal('configModal');
        }

        function confirmRecovery() {
            cachedData.isNewRecovery = false;
            sessionStorage.setItem('gameData', JSON.stringify(cachedData));
            closeModal('recoveryModal');
        }

        function logout() { sessionStorage.clear(); location.href = "index.html"; }
    </script>
</body>
</html>
