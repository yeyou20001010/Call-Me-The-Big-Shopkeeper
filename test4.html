<!-- test4.html - 對戰分析儀表板 (完整框架) -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>對戰分析 - 完整版</title>
    <style>
        .transition-all { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .theme-dark { background-color: #0f172a !important; color: #f8fafc !important; }
        .theme-dark .battle-card { background-color: #1e293b !important; border-color: #334155 !important; }
        .theme-dark table { color: #e2e8f0; }
        .theme-dark input, .theme-dark select { background-color: #0f172a !important; color: white !important; border-color: #475569 !important; }
        .sticky-col { position: sticky; left: 0; background: inherit; z-index: 10; }
        .table-container { overflow-x: auto; max-width: 100%; border-radius: 1rem; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-12 transition-all" id="mainBody">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- 返回按鈕 -->
        <div class="mb-6">
            <button onclick="goBack()" class="flex items-center gap-2 text-slate-400 hover:text-indigo-500 transition-colors group">
                <span class="text-xl group-hover:-translate-x-1 transition-transform">←</span>
                <span class="font-bold">返回主選單</span>
            </button>
        </div>

        <!-- 測試標籤 -->
        <div class="mb-6">
            <span class="bg-amber-100 text-amber-600 text-xs font-bold px-4 py-2 rounded-full uppercase tracking-wider">🧪 測試實驗室 - 對戰分析 v3.0</span>
        </div>

        <!-- ========== 敵方商會選擇 ========== -->
        <div class="bg-white rounded-[2.5rem] shadow-lg p-8 border border-slate-100 battle-card">
            <h2 class="text-2xl font-black mb-6 flex items-center gap-3">
                <span class="text-3xl">🏰</span> 
                <span>選擇敵方商會</span>
            </h2>
            <select id="enemyGuildSelect" class="w-full p-4 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 outline-none text-lg">
                <option value="">請選擇商會...</option>
                <!-- 動態從 Sheet 載入 -->
            </select>
        </div>

        <!-- ========== 敵方成員戰力分析表 ========== -->
        <div class="bg-white rounded-[2.5rem] shadow-lg p-8 border border-slate-100 battle-card">
            <h2 class="text-2xl font-black mb-6 flex items-center gap-3">
                <span class="text-3xl">📊</span>
                <span>敵方成員戰力分析</span>
            </h2>
            <div class="table-container">
                <table class="w-full text-sm min-w-[1400px]">
                    <thead class="bg-slate-50 sticky top-0">
                        <tr>
                            <th class="p-4 text-left sticky-col bg-slate-50">成員</th>
                            <th class="p-4 text-right">基礎戰力</th>
                            <th class="p-4 text-right bg-blue-50">①基礎職務+畢昇</th>
                            <th class="p-4 text-right bg-green-50">②基礎+募資10%</th>
                            <th class="p-4 text-right bg-amber-50">③錦囊300%</th>
                            <th class="p-4 text-right bg-orange-50">④錦囊300%+募資</th>
                            <th class="p-4 text-right bg-purple-50">⑤錦囊50%</th>
                            <th class="p-4 text-right bg-pink-50">⑥錦囊50%+募資</th>
                        </tr>
                    </thead>
                    <tbody id="enemyMemberTable">
                        <!-- 動態載入敵方成員 -->
                    </tbody>
                    <tfoot id="enemyTotalRow" class="bg-slate-100 font-bold">
                        <!-- 總和列 -->
                    </tfoot>
                </table>
            </div>
        </div>

        <!-- ========== 我方門客配置區 ========== -->
        <div class="bg-white rounded-[2.5rem] shadow-lg p-8 border border-slate-100 battle-card">
            <h2 class="text-2xl font-black mb-6 flex items-center gap-3">
                <span class="text-3xl">🛡️</span>
                <span>我方門客配置</span>
            </h2>
            
            <!-- 批次載入按鈕 -->
            <div class="mb-6 flex gap-4">
                <select id="batchLoadSelect" class="p-3 border-2 rounded-xl">
                    <option value="">批次載入門客資料...</option>
                    <option value="max">載入最大門客戰力</option>
                    <option value="second">載入第二大門客戰力</option>
                    <option value="third">載入第三大門客戰力</option>
                </select>
                <button onclick="batchLoadMembers()" class="px-6 py-3 bg-indigo-100 text-indigo-600 rounded-xl font-bold">套用</button>
            </div>
            
            <div class="table-container">
                <table class="w-full text-sm min-w-[1600px]">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="p-4 text-left">成員</th>
                            <th class="p-4 text-right">基礎戰力</th>
                            <th class="p-4 text-left">畢昇</th>
                            <th class="p-4 text-left">職位</th>
                            <th class="p-4 text-left">錦囊</th>
                            <th class="p-4 text-right bg-blue-50">①基礎</th>
                            <th class="p-4 text-right bg-green-50">②+募資</th>
                            <th class="p-4 text-right bg-amber-50">③+300%</th>
                            <th class="p-4 text-right bg-orange-50">④+300%+募資</th>
                            <th class="p-4 text-right bg-purple-50">⑤+50%</th>
                            <th class="p-4 text-right bg-pink-50">⑥+50%+募資</th>
                            <th class="p-4 text-center">伏兵</th>
                        </tr>
                    </thead>
                    <tbody id="myMembersTable">
                        <!-- 動態載入我方成員 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ========== 對戰模擬器 ========== -->
        <div class="bg-white rounded-[2.5rem] shadow-lg p-8 border border-slate-100 battle-card">
            <h2 class="text-2xl font-black mb-6 flex items-center gap-3">
                <span class="text-3xl">⚔️</span>
                <span>對戰模擬器</span>
            </h2>
            
            <!-- 募資選擇 -->
            <div class="mb-8">
                <label class="block font-bold mb-4 text-lg">募資加成：</label>
                <div class="flex gap-6">
                    <label class="flex items-center gap-3 p-4 border-2 rounded-2xl cursor-pointer">
                        <input type="radio" name="fundraising" value="none" checked class="w-5 h-5"> 無募資
                    </label>
                    <label class="flex items-center gap-3 p-4 border-2 rounded-2xl cursor-pointer">
                        <input type="radio" name="fundraising" value="my" class="w-5 h-5"> 我方+10%
                    </label>
                    <label class="flex items-center gap-3 p-4 border-2 rounded-2xl cursor-pointer">
                        <input type="radio" name="fundraising" value="enemy" class="w-5 h-5"> 敵方+10%
                    </label>
                </div>
            </div>
            
            <!-- 敵方錦囊情境 -->
            <div class="mb-8">
                <label class="block font-bold mb-4 text-lg">敵方錦囊情境：</label>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                    <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer">
                        <input type="radio" name="enemyScenario" value="none" checked> 無錦囊
                    </label>
                    <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer">
                        <input type="radio" name="enemyScenario" value="all_50"> 全體+50%
                    </label>
                    <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer">
                        <input type="radio" name="enemyScenario" value="all_300"> 全體+300%
                    </label>
                    <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer">
                        <input type="radio" name="enemyScenario" value="light"> 輕度使用(1/3)
                    </label>
                    <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer">
                        <input type="radio" name="enemyScenario" value="heavy"> 重度使用(2/3)
                    </label>
                    <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer">
                        <input type="radio" name="enemyScenario" value="balanced"> 均衡隨機(1/4)
                    </label>
                </div>
            </div>
            
            <!-- 模擬按鈕 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <button onclick="simulateBattle()" class="py-5 bg-indigo-600 text-white rounded-2xl font-black text-lg hover:bg-indigo-700 transition-all shadow-lg">
                    ⚔️ 一般對戰模擬
                </button>
                <button onclick="simulateCombinations()" class="py-5 bg-amber-600 text-white rounded-2xl font-black text-lg hover:bg-amber-700 transition-all shadow-lg">
                    🔄 排列組合模擬
                </button>
            </div>
            
            <!-- 模擬結果 -->
            <div id="simulateResults" class="mt-6 space-y-4"></div>
            <div id="combinationsResults" class="mt-6"></div>
        </div>
    </div>

    <script>
        // ==================== 戰力計算核心 ====================
        class BattlePowerCalculator {
            // 計算職務&畢昇加成 (G4)
            static calculateBasePower(basePower, position, biShengLevel) {
                let positionBonus = { '會長': 0.3, '副會長': 0.15, '精英': 0.1 }[position] || 0;
                
                let biShengBonus = 0;
                if (biShengLevel && biShengLevel !== '無') {
                    biShengBonus = { '無星': 0.05, '1星': 0.075, '2星': 0.1, '3星': 0.125 }[biShengLevel] || 0;
                }
                
                return basePower * (1 + positionBonus + biShengBonus);
            }
            
            // 個別戰力轉換顯示
            static formatPower(power) {
                if (power >= 1000000000) {
                    return Math.floor(power / 100000000 * 100) / 100 + 'e';
                } else if (power >= 100000000) {
                    return Math.floor(power / 100000000 * 1000) / 1000 + 'e';
                } else {
                    return Math.floor(power / 10000 * 10) / 10 + '萬';
                }
            }
            
            // 總和戰力轉換顯示
            static formatTotalPower(power) {
                if (power >= 100000000) {
                    return Math.floor(power / 100000000) + 'e';
                } else {
                    return Math.floor(power / 10000) + '萬';
                }
            }
            
            // 計算門客六種戰力
            static calculateSixScenarios(member) {
                const basePower = Number(member.basePower);
                const g4 = this.calculateBasePower(basePower, member.position, member.biShengLevel);
                
                return {
                    name: member.name,
                    basePower: basePower,
                    baseDisplay: this.formatPower(basePower),
                    scenario1: { value: g4, display: this.formatPower(g4) },
                    scenario2: { value: g4 + basePower * 0.1, display: this.formatPower(g4 + basePower * 0.1) },
                    scenario3: { value: g4 + basePower * 3, display: this.formatPower(g4 + basePower * 3) },
                    scenario4: { value: g4 + basePower * 3.1, display: this.formatPower(g4 + basePower * 3.1) },
                    scenario5: { value: g4 + basePower * 0.5, display: this.formatPower(g4 + basePower * 0.5) },
                    scenario6: { value: g4 + basePower * 0.6, display: this.formatPower(g4 + basePower * 0.6) }
                };
            }
        }

        // ==================== 對戰模擬器 ====================
        class BattleSimulator {
            constructor(myMembers, enemyMembers) {
                this.myMembers = myMembers;
                this.enemyMembers = enemyMembers;
                this.fundraisingSide = 'none';
                this.activeDebuff = null;
            }
            
            // 依職位排序
            static sortByPosition(members) {
                const order = { '會長': 1, '副會長': 2, '精英': 3, '成員': 4 };
                return [...members].sort((a, b) => 
                    (order[a.position] || 999) - (order[b.position] || 999)
                );
            }
            
            // 計算門客戰力（考慮募資、錦囊、debuff）
            calculateMemberPower(member, talisman = 'none', fundraising = false, isDebuffed = false) {
                const basePower = Number(member.basePower);
                const g4 = BattlePowerCalculator.calculateBasePower(basePower, member.position, member.biShengLevel);
                
                let finalPower = g4;
                
                // 自身錦囊
                if (talisman === 'self_300') finalPower = g4 + basePower * 3;
                else if (talisman === 'self_50') finalPower = g4 + basePower * 0.5;
                
                // 募資
                if (fundraising) {
                    if (talisman === 'self_300') finalPower = g4 + basePower * 3.1;
                    else if (talisman === 'self_50') finalPower = g4 + basePower * 0.6;
                    else finalPower = g4 + basePower * 0.1;
                }
                
                // debuff
                if (isDebuffed) finalPower *= 0.7;
                
                return {
                    power: Math.round(finalPower),
                    display: BattlePowerCalculator.formatPower(finalPower),
                    maxBattles: talisman === 'self_300' ? 1 : 5,
                    member: member,
                    talisman: talisman
                };
            }
            
            // 對戰邏輯
            fight(attacker, defender) {
                const isDefenderDebuffed = this.activeDebuff !== null;
                
                const attackerPower = this.calculateMemberPower(
                    attacker.member, attacker.talisman, 
                    this.fundraisingSide === 'my', false
                ).power;
                
                const defenderPower = this.calculateMemberPower(
                    defender.member, defender.talisman,
                    this.fundraisingSide === 'enemy', isDefenderDebuffed
                ).power;
                
                if (attackerPower > defenderPower) {
                    if (attacker.talisman === 'enemy_30' && this.activeDebuff === null) {
                        this.activeDebuff = {
                            source: attacker.member.name,
                            remainingBattles: attacker.remainingBattles - 1
                        };
                    }
                    return { winner: 'attacker', attackerPower, defenderPower };
                } else {
                    if (attacker.talisman === 'enemy_30') this.activeDebuff = null;
                    return { winner: 'defender', attackerPower, defenderPower };
                }
            }
            
            // 模擬對戰（需完整實作）
            simulateBattle() {
                // 完整對戰邏輯...
            }
        }

        // ==================== 全域變數 ====================
        let myMembers = [];
        let enemyMembers = [];
        let guildList = [];

        // ==================== 初始化 ====================
        window.onload = function() {
            applyTheme();
            loadGuildList();      // 從 Sheet 載入商會列表
            loadMyMembers();      // 從 Sheet 載入我方成員
        };

        // ==================== Sheet 讀取函數 ====================
        async function loadGuildList() {
            // TODO: 從 Sheet 載入所有商會名稱
            // 敵方商會 = 所有分頁名稱 (排除「我方_主戰力」、「我方_備戰庫」)
            const response = await fetch(`${SHEET_URL}?action=getGuilds`);
            const data = await response.json();
            guildList = data.guilds;
            
            const select = document.getElementById('enemyGuildSelect');
            select.innerHTML = '<option value="">請選擇商會...</option>' +
                guildList.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
        }

        async function loadEnemyMembers(guildId) {
            // TODO: 從指定分頁載入敵方成員
            // 欄位：名稱, 基礎戰力, 畢昇星級, 職位
            const response = await fetch(`${SHEET_URL}?action=getGuildMembers&guildId=${guildId}`);
            const data = await response.json();
            enemyMembers = data.members;
            renderEnemyTable();
        }

        async function loadMyMembers() {
            // TODO: 從「我方_主戰力」分頁載入
            // 欄位：名稱, 基礎戰力, 畢昇星級, 職位
            const response = await fetch(`${SHEET_URL}?action=getMyMain`);
            const data = await response.json();
            myMembers = data.members;
            renderMyTable();
        }

        async function batchLoadMembers(type) {
            // TODO: 從「我方_備戰庫」分頁載入
            // type = 'max'/'second'/'third' 對應不同欄位
            const response = await fetch(`${SHEET_URL}?action=getMyReserve&type=${type}`);
            const data = await response.json();
            
            // 更新 myMembers 的 basePower
            data.members.forEach(newMember => {
                const index = myMembers.findIndex(m => m.name === newMember.name);
                if (index !== -1) {
                    myMembers[index].basePower = newMember.basePower;
                }
            });
            renderMyTable();
        }

        // ==================== 渲染函數 ====================
        function renderEnemyTable() {
            if (!enemyMembers.length) return;
            
            const tbody = document.getElementById('enemyMemberTable');
            const scenarios = enemyMembers.map(m => BattlePowerCalculator.calculateSixScenarios(m));
            
            tbody.innerHTML = scenarios.map(s => `
                <tr class="border-b hover:bg-slate-50">
                    <td class="p-4 sticky-col bg-white font-bold">${s.name}</td>
                    <td class="p-4 text-right">${s.baseDisplay}</td>
                    <td class="p-4 text-right bg-blue-50">${s.scenario1.display}</td>
                    <td class="p-4 text-right bg-green-50">${s.scenario2.display}</td>
                    <td class="p-4 text-right bg-amber-50">${s.scenario3.display}</td>
                    <td class="p-4 text-right bg-orange-50">${s.scenario4.display}</td>
                    <td class="p-4 text-right bg-purple-50">${s.scenario5.display}</td>
                    <td class="p-4 text-right bg-pink-50">${s.scenario6.display}</td>
                </tr>
            `).join('');
            
            // 計算總和
            const totals = [1,2,3,4,5,6].map(i => {
                const sum = scenarios.reduce((acc, s) => acc + s[`scenario${i}`].value, 0);
                return BattlePowerCalculator.formatTotalPower(sum);
            });
            
            document.getElementById('enemyTotalRow').innerHTML = `
                <tr>
                    <td class="p-4 sticky-col bg-slate-100 font-black">總和</td>
                    <td class="p-4 text-right">-</td>
                    <td class="p-4 text-right bg-blue-100 font-bold">${totals[0]}</td>
                    <td class="p-4 text-right bg-green-100 font-bold">${totals[1]}</td>
                    <td class="p-4 text-right bg-amber-100 font-bold">${totals[2]}</td>
                    <td class="p-4 text-right bg-orange-100 font-bold">${totals[3]}</td>
                    <td class="p-4 text-right bg-purple-100 font-bold">${totals[4]}</td>
                    <td class="p-4 text-right bg-pink-100 font-bold">${totals[5]}</td>
                </tr>
            `;
        }

        function renderMyTable() {
            const tbody = document.getElementById('myMembersTable');
            
            tbody.innerHTML = myMembers.map((member, index) => {
                const s = BattlePowerCalculator.calculateSixScenarios(member);
                return `
                <tr class="border-b hover:bg-slate-50">
                    <td class="p-4 font-bold">${member.name}</td>
                    <td class="p-4">
                        <input type="number" value="${member.basePower}" 
                               onchange="updateMember(${index}, 'basePower', this.value)"
                               class="w-32 p-1 border rounded text-right">
                        <span class="text-xs text-slate-400 ml-1">(${s.baseDisplay})</span>
                    </td>
                    <td class="p-4">
                        <select onchange="updateMember(${index}, 'biShengLevel', this.value)">
                            <option value="無" ${member.biShengLevel === '無' ? 'selected' : ''}>無</option>
                            <option value="無星" ${member.biShengLevel === '無星' ? 'selected' : ''}>無星</option>
                            <option value="1星" ${member.biShengLevel === '1星' ? 'selected' : ''}>1星</option>
                            <option value="2星" ${member.biShengLevel === '2星' ? 'selected' : ''}>2星</option>
                            <option value="3星" ${member.biShengLevel === '3星' ? 'selected' : ''}>3星</option>
                        </select>
                    </td>
                    <td class="p-4">
                        <select onchange="updateMember(${index}, 'position', this.value)">
                            <option value="成員" ${member.position === '成員' ? 'selected' : ''}>成員</option>
                            <option value="精英" ${member.position === '精英' ? 'selected' : ''}>精英</option>
                            <option value="副會長" ${member.position === '副會長' ? 'selected' : ''}>副會長</option>
                            <option value="會長" ${member.position === '會長' ? 'selected' : ''}>會長</option>
                        </select>
                    </td>
                    <td class="p-4">
                        <select onchange="handleTalismanChange(${index}, this.value)">
                            <option value="none" ${member.talisman === 'none' ? 'selected' : ''}>無</option>
                            <option value="self_300" ${member.talisman === 'self_300' ? 'selected' : ''}>+300%</option>
                            <option value="self_50" ${member.talisman === 'self_50' ? 'selected' : ''}>+50%</option>
                            <option value="enemy_30" ${member.talisman === 'enemy_30' ? 'selected' : ''}>-30%</option>
                            <option value="ambush" ${member.talisman === 'ambush' ? 'selected' : ''}>伏兵</option>
                        </select>
                    </td>
                    <td class="p-4 text-right bg-blue-50">${s.scenario1.display}</td>
                    <td class="p-4 text-right bg-green-50">${s.scenario2.display}</td>
                    <td class="p-4 text-right bg-amber-50">${s.scenario3.display}</td>
                    <td class="p-4 text-right bg-orange-50">${s.scenario4.display}</td>
                    <td class="p-4 text-right bg-purple-50">${s.scenario5.display}</td>
                    <td class="p-4 text-right bg-pink-50">${s.scenario6.display}</td>
                    <td class="p-4">
                        <div id="ambush-${index}" class="${member.talisman === 'ambush' ? '' : 'hidden'}">
                            <input type="number" value="${member.ambushPower || ''}" 
                                   placeholder="伏兵戰力"
                                   onchange="updateAmbush(${index}, this.value)"
                                   class="w-24 p-1 border rounded text-sm">
                        </div>
                    </td>
                </tr>
            `}).join('');
        }

        // ==================== 更新函數 ====================
        function updateMember(index, field, value) {
            if (field === 'basePower') value = Number(value);
            myMembers[index][field] = value;
        }

        function handleTalismanChange(index, value) {
            myMembers[index].talisman = value;
            document.getElementById(`ambush-${index}`).style.display = value === 'ambush' ? 'block' : 'none';
        }

        function updateAmbush(index, value) {
            myMembers[index].ambushPower = Number(value);
        }

        // ==================== 模擬函數 ====================
        function simulateBattle() {
            // 待實作
        }

        function simulateCombinations() {
            // 待實作
        }

        // ==================== 輔助函數 ====================
        function applyTheme() {
            try {
                const data = JSON.parse(sessionStorage.getItem('gameData'));
                if (data?.config?.CurrentTheme === 'dark') {
                    document.getElementById('mainBody').classList.add('theme-dark');
                }
            } catch (e) {}
        }

        function goBack() {
            location.href = sessionStorage.getItem('gameData') ? 'portal.html' : 'index.html';
        }
    </script>
