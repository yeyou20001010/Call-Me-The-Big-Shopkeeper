<!-- test4.html - 對戰分析儀表板 (修正版) -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        .transition-all { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .theme-dark { background-color: #0f172a !important; color: #f8fafc !important; }
        .theme-dark .battle-card { background-color: #1e293b !important; border-color: #334155 !important; }

        .sticky-col { position: sticky; left: 0; background: inherit; z-index: 10; }
        .table-container { overflow-x: auto; max-width: 100%; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-12 transition-all" id="mainBody">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- 返回按鈕 -->
        <div class="mb-6">
            <button onclick="goBack()" class="flex items-center gap-2 text-slate-400 hover:text-indigo-500 transition-colors group">
                <span class="text-xl group-hover:-translate-x-1 transition-transform">←</span>

        <!-- 測試標籤 -->
        <div class="mb-6">
            <span class="bg-amber-100 text-amber-600 text-xs font-bold px-4 py-2 rounded-full uppercase tracking-wider">🧪 測試實驗室 - 對戰分析 v2.0</span>

        <!-- 1. 敵方商會選擇區 -->

                <option value="guild1" selected>天下商會 (範例資料 - 34人)</option>

        <div class="bg-white rounded-[2.5rem] shadow-lg p-8 border border-slate-100 battle-card">
            <h2 class="text-2xl font-black mb-6 flex items-center gap-3">
                <span class="text-3xl">📊</span>
                <span>敵方成員戰力分析</span>

            <div class="table-container rounded-2xl border border-slate-100">

                            <th class="p-4 text-right bg-amber-50">③錦囊300%</th>
                            <th class="p-4 text-right bg-orange-50">④錦囊300%+募資</th>

        <!-- 3. 我方門客配置區 (從 Sheet 載入基礎資料) -->
        <div class="bg-white rounded-[2.5rem] shadow-lg p-8 border border-slate-100 battle-card">
            <h2 class="text-2xl font-black mb-6 flex items-center gap-3">

            <!-- 載入提示 -->

            <!-- 門客表格 -->

                            <th class="p-4 text-left">成員</th>

                        <!-- 由 JavaScript 動態生成 -->

            </div>
            
            <div class="flex gap-4">
                <button onclick="saveMyConfig()" class="px-8 py-4 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 transition-all">
                    💾 儲存職位調整
                </button>
                <button onclick="loadMyFromSheet()" class="px-8 py-4 bg-slate-100 rounded-2xl font-bold hover:bg-slate-200 transition-all">
                    🔄 重新載入 Sheet 資料

        </div>

        <!-- 4. 對戰模擬器 -->
        <div class="bg-white rounded-[2.5rem] shadow-lg p-8 border border-slate-100 battle-card">
            <h2 class="text-2xl font-black mb-6 flex items-center gap-3">
                <span class="text-3xl">⚔️</span>
                <span>對戰模擬器</span>
            </h2>
            
            <!-- 募資選擇 (全域) -->
            <div class="mb-8">
                <label class="flex items-center gap-3 p-4 bg-slate-50 rounded-2xl cursor-pointer">
                    <input type="checkbox" id="globalFundraising" class="w-5 h-5"> 
                    <span class="font-bold text-lg">全域使用募資 (+10%戰力)</span>
                </label>
            </div>
            
            <!-- 模擬按鈕區 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <button onclick="simulateBattle()" class="py-5 bg-indigo-600 text-white rounded-2xl font-black text-lg hover:bg-indigo-700 transition-all shadow-lg">
                    ⚔️ 一般對戰模擬
                </button>
                <button onclick="simulateCombinations()" class="py-5 bg-amber-600 text-white rounded-2xl font-black text-lg hover:bg-amber-700 transition-all shadow-lg">
                    🔄 排列組合模擬 (成員順序)
                </button>
            </div>
            
            <!-- 模擬結果 -->
            <div id="simulateResults" class="mt-6 space-y-4">
                <!-- 動態顯示結果 -->
            </div>
            
            <!-- 排列組合結果 -->
            <div id="combinationsResults" class="mt-6">
                <!-- 動態顯示排列組合結果 -->
            </div>
        </div>

        <!-- 底部測試區提示 -->
        <div class="mt-6 text-center">
            <p class="text-[10px] text-slate-300 uppercase tracking-widest">
                Test Version 2.0.0 | 我方基礎資料從 Sheet 讀取，職位調整儲存在瀏覽器
            </p>
        </div>
    </div>

    <script>
        // ==================== 戰力計算核心 ====================
        class BattlePowerCalculator {
            
            // 計算職務&畢昇加成後的基礎戰力 (G4)
            static calculateBasePower(basePower, position, biShengLevel) {
                let positionBonus = 0;
                switch(position) {
                    case '會長': positionBonus = 0.3; break;
                    case '副會長': positionBonus = 0.15; break;
                    case '精英': positionBonus = 0.1; break;
                    default: positionBonus = 0;
                }
                
                let biShengBonus = 0;
                if (biShengLevel && biShengLevel !== '無') {
                    switch(biShengLevel) {
                        case '無星': biShengBonus = 0.05; break;
                        case '1星': biShengBonus = 0.075; break;
                        case '2星': biShengBonus = 0.1; break;
                        case '3星': biShengBonus = 0.125; break;
                    }
                }
                
                return basePower * (1 + positionBonus + biShengBonus);
            }
            
            // 單位轉換顯示
            static formatPower(power) {
                if (power >= 1000000000) {
                    const value = Math.floor(power / 100000000 * 100) / 100;
                    return value.toFixed(2) + 'e';
                } else if (power >= 100000000) {
                    const value = Math.floor(power / 100000000 * 1000) / 1000;
                    return value.toFixed(3) + 'e';
                } else {
                    const value = Math.floor(power / 10000 * 10) / 10;
                    return value.toFixed(1) + '萬';
                }
            }
            
            // 計算門客六種戰力
            static calculateSixScenarios(member) {
                const basePower = Number(member.basePower);
                const position = member.position;
                const biShengLevel = member.biShengLevel || '無';
                
                const g4 = this.calculateBasePower(basePower, position, biShengLevel);
                
                return {
                    name: member.name,
                    basePower: basePower,
                    baseDisplay: this.formatPower(basePower),
                    scenario1: { value: g4, display: this.formatPower(g4) },
                    scenario2: { value: g4 + (basePower * 0.1), display: this.formatPower(g4 + (basePower * 0.1)) },
                    scenario3: { value: g4 + (basePower * 3), display: this.formatPower(g4 + (basePower * 3)) },
                    scenario4: { value: g4 + (basePower * 3.1), display: this.formatPower(g4 + (basePower * 3.1)) },
                    scenario5: { value: g4 + (basePower * 0.5), display: this.formatPower(g4 + (basePower * 0.5)) },
                    scenario6: { value: g4 + (basePower * 0.6), display: this.formatPower(g4 + (basePower * 0.6)) }
                };
            }
        }

        // ==================== 對戰模擬器 ====================
        class BattleSimulator {
            constructor(myMembers, enemyMembers) {
                this.myMembers = myMembers;
                this.enemyMembers = enemyMembers;
            }
            
            // 依職務排序門客
            static sortByPosition(members) {
                const positionOrder = { '會長': 1, '副會長': 2, '精英': 3, '成員': 4 };
                return [...members].sort((a, b) => 
                    (positionOrder[a.position] || 999) - (positionOrder[b.position] || 999)
                );
            }
            
            // 計算門客戰力 (依個人錦囊)
            calculateMemberPower(member, globalFundraising) {
                const basePower = Number(member.basePower);
                const position = member.position;
                const biShengLevel = member.biShengLevel || '無';
                const talisman = member.talisman || 'none';
                
                let positionBonus = 0;
                switch(position) {
                    case '會長': positionBonus = 0.3; break;
                    case '副會長': positionBonus = 0.15; break;
                    case '精英': positionBonus = 0.1; break;
                }
                
                let biShengBonus = 0;
                if (biShengLevel !== '無') {
                    switch(biShengLevel) {
                        case '無星': biShengBonus = 0.05; break;
                        case '1星': biShengBonus = 0.075; break;
                        case '2星': biShengBonus = 0.1; break;
                        case '3星': biShengBonus = 0.125; break;
                    }
                }
                
                let g4 = basePower * (1 + positionBonus + biShengBonus);
                let finalPower = g4;
                
                // 個人錦囊
                if (talisman === 'self_300') {
                    finalPower = g4 + (basePower * 3);
                } else if (talisman === 'self_50') {
                    finalPower = g4 + (basePower * 0.5);
                }
                
                // 全域募資
                if (globalFundraising) {
                    if (talisman === 'self_300') {
                        finalPower = g4 + (basePower * 3.1);
                    } else if (talisman === 'self_50') {
                        finalPower = g4 + (basePower * 0.6);
                    } else {
                        finalPower = g4 + (basePower * 0.1);
                    }
                }
                
                return {
                    power: Math.round(finalPower),
                    display: BattlePowerCalculator.formatPower(finalPower),
                    maxBattles: talisman === 'self_300' ? 1 : 5,
                    member: member,
                    talisman: talisman
                };
            }
            
            // 對戰
            static fight(attacker, defender) {
                if (attacker.power > defender.power) {
                    return {
                        winner: 'attacker',
                        attackerRemainingBattles: attacker.maxBattles - 1,
                        defenderRemainingBattles: 0
                    };
                } else {
                    return {
                        winner: 'defender',
                        attackerRemainingBattles: 0,
                        defenderRemainingBattles: defender.maxBattles - 1
                    };
                }
            }
            
            // 模擬對戰
            simulateBattle(globalFundraising) {
                let mySorted = BattleSimulator.sortByPosition(this.myMembers);
                let enemySorted = BattleSimulator.sortByPosition(this.enemyMembers);
                
                let myFighters = mySorted.map(m => 
                    this.calculateMemberPower(m, globalFundraising)
                );
                
                let enemyFighters = enemySorted.map(m => 
                    this.calculateMemberPower({...m, talisman: 'none'}, false)
                );
                
                // 處理敵方-30%錦囊
                myFighters.forEach(f => {
                    if (f.talisman === 'enemy_30') {
                        enemyFighters = enemyFighters.map(ef => ({
                            ...ef,
                            power: Math.round(ef.power * 0.7),
                            display: BattlePowerCalculator.formatPower(ef.power * 0.7)
                        }));
                    }
                });
                
                myFighters.forEach(f => f.remainingBattles = f.maxBattles);
                enemyFighters.forEach(f => f.remainingBattles = f.maxBattles);
                
                const battleLog = [];
                let myIndex = 0, enemyIndex = 0;
                let round = 1;
                
                while (myIndex < myFighters.length && enemyIndex < enemyFighters.length) {
                    const currentMy = myFighters[myIndex];
                    const currentEnemy = enemyFighters[enemyIndex];
                    
                    if (currentMy.remainingBattles === 0) { myIndex++; continue; }
                    if (currentEnemy.remainingBattles === 0) { enemyIndex++; continue; }
                    
                    const result = BattleSimulator.fight(currentMy, currentEnemy);
                    
                    battleLog.push({
                        round: round++,
                        myFighter: { name: currentMy.member.name, power: currentMy.power, position: currentMy.member.position },
                        enemyFighter: { name: currentEnemy.member.name, power: currentEnemy.power, position: currentEnemy.member.position },
                        winner: result.winner
                    });
                    
                    if (result.winner === 'attacker') {
                        currentMy.remainingBattles = result.attackerRemainingBattles;
                        currentEnemy.remainingBattles = 0;
                        enemyIndex++;
                    } else {
                        currentEnemy.remainingBattles = result.defenderRemainingBattles;
                        currentMy.remainingBattles = 0;
                        myIndex++;
                    }
                }
                
                const myRemaining = myFighters.slice(myIndex).filter(f => f.remainingBattles > 0).length;
                const enemyRemaining = enemyFighters.slice(enemyIndex).filter(f => f.remainingBattles > 0).length;
                
                return {
                    winner: myRemaining > enemyRemaining ? '我方' : '敵方',
                    myRemainingCount: myRemaining,
                    enemyRemainingCount: enemyRemaining,
                    battleLog: battleLog,
                    myTotalPower: myFighters.reduce((sum, f) => sum + f.power, 0),
                    enemyTotalPower: enemyFighters.reduce((sum, f) => sum + f.power, 0)
                };
            }
            
            // 排列組合模擬 (成員順序)
            simulateCombinations(globalFundraising) {
                const myPositioned = this.myMembers.filter(m => 
                    m.position === '會長' || m.position === '副會長' || m.position === '精英'
                );
                const myNormal = this.myMembers.filter(m => m.position === '成員');
                
                const permutations = this.generatePermutations(myNormal, Math.min(6, myNormal.length));
                
                const results = permutations.map(perm => {
                    const testOrder = [...myPositioned, ...perm];
                    const originalMembers = this.myMembers;
                    this.myMembers = testOrder;
                    const result = this.simulateBattle(globalFundraising);
                    this.myMembers = originalMembers;
                    
                    return {
                        order: testOrder.map(m => `${m.name}`).join(' → '),
                        result: result
                    };
                });
                
                const bestResult = results.reduce((best, current) => {
                    if (current.result.winner === '我方' && best.result.winner !== '我方') return current;
                    if (current.result.winner === '我方' && best.result.winner === '我方') {
                        return current.result.myRemainingCount > best.result.myRemainingCount ? current : best;
                    }
                    return best;
                }, results[0]);
                
                return { allResults: results, bestResult: bestResult };
            }
            
            generatePermutations(array, limit) {
                if (array.length <= 1) return [array];
                const result = [];
                const used = new Array(array.length).fill(false);
                
                function backtrack(current) {
                    if (current.length === array.length) {
                        result.push([...current]);
                        return;
                    }
                    for (let i = 0; i < array.length; i++) {
                        if (used[i]) continue;
                        used[i] = true;
                        current.push(array[i]);
                        backtrack(current);
                        current.pop();
                        used[i] = false;
                        if (result.length >= limit) return;
                    }
                }
                
                backtrack([]);
                return result;
            }
        }

        // ==================== 全域變數 ====================
        let myMembers = [];
        let enemyMembers = [];

        // ==================== 初始化 ====================
        window.onload = function() {
            // 檢查登入狀態
            try {
                const data = JSON.parse(sessionStorage.getItem('gameData'));
                if (data?.config?.CurrentTheme) {
                    applyTheme(data.config.CurrentTheme);
                }
            } catch (e) {
                console.log('無法讀取主題設定');
            }
            
            // 載入範例敵方資料 (34人)
            loadExampleEnemy();
            
            // 從 Sheet 載入我方資料 (模擬)
            loadMyFromSheet();
        };

        // ==================== 主題套用 ====================
        function applyTheme(theme) {
            const body = document.getElementById('mainBody');
            body.classList.remove('theme-dark');
            body.style.backgroundColor = "";
            if (theme === 'dark') {
                body.classList.add('theme-dark');
            } else if (theme === 'christmas') {
                body.style.backgroundColor = "#fff1f2";
            } else {
                body.style.backgroundColor = "#f8fafc";
            }
        }

        // ==================== 返回主選單 ====================
        function goBack() {
            if (!sessionStorage.getItem('gameData')) {
                location.href = 'index.html';
            } else {
                location.href = 'portal.html';
            }
        }

        // ==================== 敵方資料 (34人範例) ====================
        function loadExampleEnemy() {
            enemyMembers = [];
            // 生成34個敵方成員
            for (let i = 1; i <= 34; i++) {
                let position = '成員';
                if (i === 1) position = '會長';
                else if (i <= 3) position = '副會長';
                else if (i <= 8) position = '精英';
                
                let biSheng = '無';
                if (i % 5 === 0) biSheng = '3星';
                else if (i % 4 === 0) biSheng = '2星';
                else if (i % 3 === 0) biSheng = '1星';
                else if (i % 2 === 0) biSheng = '無星';
                
                enemyMembers.push({
                    name: `敵方成員${i}`,
                    basePower: 8000 + Math.floor(Math.random() * 7000),
                    biShengLevel: biSheng,
                    position: position
                });
            }
            
            renderEnemyTable();
        }

        function renderEnemyTable() {
            const tbody = document.getElementById('enemyMemberTable');
            
            tbody.innerHTML = enemyMembers.map(member => {
                const scenarios = BattlePowerCalculator.calculateSixScenarios(member);
                
                return `
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="p-4 sticky-col bg-white font-bold">${member.name}</td>
                        <td class="p-4 text-right">${scenarios.baseDisplay}</td>
                        <td class="p-4 text-right bg-blue-50">${scenarios.scenario1.display}</td>
                        <td class="p-4 text-right bg-green-50">${scenarios.scenario2.display}</td>
                        <td class="p-4 text-right bg-amber-50">${scenarios.scenario3.display}</td>
                        <td class="p-4 text-right bg-orange-50">${scenarios.scenario4.display}</td>
                        <td class="p-4 text-right bg-purple-50">${scenarios.scenario5.display}</td>
                        <td class="p-4 text-right bg-pink-50">${scenarios.scenario6.display}</td>
                    </tr>
                `;
            }).join('');
        }

        // ==================== 我方資料 (從 Sheet 載入) ====================
        function loadMyFromSheet() {
            // 模擬從 Sheet 讀取的資料
            myMembers = [];
            
            // 實際應用時，這裡會改為 fetch 從你的對戰 Sheet 讀取
            // const response = await fetch(`${BATTLE_SHEET_URL}?action=getMyGuild`);
            // const data = await response.json();
            
            // 範例資料
            const memberNames = ['張飛', '關羽', '趙雲', '馬超', '黃忠', '劉備', '諸葛亮', '龐統', '魏延', '周瑜'];
            for (let i = 1; i <= 10; i++) {
                let position = '成員';
                if (i === 1) position = '會長';
                else if (i <= 3) position = '副會長';
                else if (i <= 6) position = '精英';
                
                let biSheng = '無';
                if (i % 4 === 0) biSheng = '3星';
                else if (i % 3 === 0) biSheng = '2星';
                else if (i % 2 === 0) biSheng = '1星';
                
                myMembers.push({
                    name: memberNames[i-1] || `我方成員${i}`,
                    basePower: 9000 + Math.floor(Math.random() * 8000),
                    biShengLevel: biSheng,
                    position: position,
                    talisman: 'none'  // 預設不使用錦囊
                });
            }
            
            renderMyTable();
        }

        function renderMyTable() {
            const tbody = document.getElementById('myMembersTable');
            
            tbody.innerHTML = myMembers.map((member, index) => `
                <tr class="border-b border-slate-100 hover:bg-slate-50">
                    <td class="p-4 font-bold">${member.name}</td>
                    <td class="p-4 text-right">${member.basePower.toLocaleString()}</td>
                    <td class="p-4">
                        <select class="p-2 border rounded-xl text-sm" onchange="updateMember(${index}, 'biSheng', this.value)">
                            <option value="無" ${member.biShengLevel === '無' ? 'selected' : ''}>無</option>
                            <option value="無星" ${member.biShengLevel === '無星' ? 'selected' : ''}>無星</option>
                            <option value="1星" ${member.biShengLevel === '1星' ? 'selected' : ''}>1星</option>
                            <option value="2星" ${member.biShengLevel === '2星' ? 'selected' : ''}>2星</option>
                            <option value="3星" ${member.biShengLevel === '3星' ? 'selected' : ''}>3星</option>
                        </select>
                    </td>
                    <td class="p-4">
                        <select class="p-2 border rounded-xl text-sm" onchange="updateMember(${index}, 'position', this.value)">
                            <option value="成員" ${member.position === '成員' ? 'selected' : ''}>成員</option>
                            <option value="精英" ${member.position === '精英' ? 'selected' : ''}>精英</option>
                            <option value="副會長" ${member.position === '副會長' ? 'selected' : ''}>副會長</option>
                            <option value="會長" ${member.position === '會長' ? 'selected' : ''}>會長</option>
                        </select>
                    </td>
                    <td class="p-4">
                        <select class="p-2 border rounded-xl text-sm" onchange="updateMember(${index}, 'talisman', this.value)">
                            <option value="none" ${member.talisman === 'none' ? 'selected' : ''}>不使用</option>
                            <option value="self_300" ${member.talisman === 'self_300' ? 'selected' : ''}>自身+300%</option>
                            <option value="self_50" ${member.talisman === 'self_50' ? 'selected' : ''}>自身+50%</option>
                            <option value="enemy_30" ${member.talisman === 'enemy_30' ? 'selected' : ''}>敵方-30%</option>
                        </select>
                    </td>
                    <td class="p-4 text-center">
                        <button onclick="calculateMemberPreview(${index})" class="text-xs text-indigo-600 hover:text-indigo-800">預覽戰力</button>
                    </td>
                </tr>
            `).join('');
        }

        function updateMember(index, field, value) {
            myMembers[index][field] = value;
        }

        function calculateMemberPreview(index) {
            const member = myMembers[index];
            const scenarios = BattlePowerCalculator.calculateSixScenarios(member);
            
            alert(`
                ${member.name} 戰力預覽：
                基礎職務+畢昇：${scenarios.scenario1.display}
                基礎+募資10%：${scenarios.scenario2.display}
                錦囊300%：${scenarios.scenario3.display}
                錦囊300%+募資：${scenarios.scenario4.display}
                錦囊50%：${scenarios.scenario5.display}
                錦囊50%+募資：${scenarios.scenario6.display}
            `);
        }

        function saveMyConfig() {
            localStorage.setItem('myBattlePositions', JSON.stringify(
                myMembers.map(m => ({ name: m.name, position: m.position }))
            ));
            alert('職位調整已儲存！');
        }

        // ==================== 對戰模擬 ====================
        function simulateBattle() {
            const globalFundraising = document.getElementById('globalFundraising').checked;
            
            const simulator = new BattleSimulator(myMembers, enemyMembers);
            const results = simulator.simulateBattle(globalFundraising);
            
            displayBattleResults(results, globalFundraising);
        }

        function simulateCombinations() {
            const globalFundraising = document.getElementById('globalFundraising').checked;
            
            const simulator = new BattleSimulator(myMembers, enemyMembers);
            const results = simulator.simulateCombinations(globalFundraising);
            
            displayCombinationsResults(results);
        }

        function displayBattleResults(results, globalFundraising) {
            let html = `
                <div class="bg-indigo-50 p-8 rounded-2xl">
                    <h3 class="font-black text-xl mb-6 flex items-center gap-2">
                        <span>⚔️</span> 對戰結果 ${globalFundraising ? '(含募資)' : ''}
                    </h3>
                    
                    <div class="grid grid-cols-2 gap-6 mb-6">
                        <div class="bg-white p-6 rounded-2xl">
                            <p class="text-xs text-slate-400 mb-1">我方總戰力</p>
                            <p class="text-3xl font-black text-blue-600">${BattlePowerCalculator.formatPower(results.myTotalPower)}</p>
                        </div>
                        <div class="bg-white p-6 rounded-2xl">
                            <p class="text-xs text-slate-400 mb-1">敵方總戰力</p>
                            <p class="text-3xl font-black text-red-600">${BattlePowerCalculator.formatPower(results.enemyTotalPower)}</p>
                        </div>
                    </div>
                    
                    <div class="mb-6 p-6 bg-white rounded-2xl">
                        <p class="text-lg font-bold mb-2">
                            最終結果：<span class="${results.winner === '我方' ? 'text-blue-600' : 'text-red-600'} text-2xl">${results.winner} 勝利</span>
                        </p>
                        <p class="text-sm text-slate-500">
                            我方剩餘 ${results.myRemainingCount} 人 | 敵方剩餘 ${results.enemyRemainingCount} 人
                        </p>
                    </div>
                    
                    <details class="mt-4">
                        <summary class="cursor-pointer text-sm font-bold text-indigo-600">查看詳細對戰過程</summary>
                        <div class="mt-4 space-y-2 max-h-96 overflow-y-auto">
                            ${results.battleLog.map(log => `
                                <div class="p-4 bg-white rounded-xl text-sm">
                                    <div class="flex justify-between items-center">
                                        <span class="font-bold text-blue-600">${log.myFighter.name}</span>
                                        <span class="text-slate-400">第 ${log.round} 回合</span>
                                        <span class="font-bold text-red-600">${log.enemyFighter.name}</span>
                                    </div>
                                    <div class="flex justify-between items-center mt-2 text-xs">
                                        <span>${BattlePowerCalculator.formatPower(log.myFighter.power)}</span>
                                        <span class="text-slate-300">vs</span>
                                        <span>${BattlePowerCalculator.formatPower(log.enemyFighter.power)}</span>
                                    </div>
                                    <p class="text-xs mt-2 ${log.winner === 'attacker' ? 'text-blue-600' : 'text-red-600'}">
                                        ${log.winner === 'attacker' ? '我方獲勝' : '敵方獲勝'}
                                    </p>
                                </div>
                            `).join('')}
                        </div>
                    </details>
                </div>
            `;
            
            document.getElementById('simulateResults').innerHTML = html;
            document.getElementById('combinationsResults').innerHTML = '';
        }

        function displayCombinationsResults(comboResults) {
            let html = `
                <div class="mt-6 p-8 bg-amber-50 rounded-2xl">
                    <h4 class="font-black text-xl mb-6 flex items-center gap-2">
                        <span>🔄</span> 排列組合最佳結果
                    </h4>
                    
                    <div class="mb-6 p-6 bg-white rounded-2xl">
                        <p class="font-bold mb-3">最佳順序：</p>
                        <p class="text-sm p-4 bg-slate-50 rounded-xl text-slate-600">${comboResults.bestResult.order}</p>
                        <p class="mt-4 text-lg">
                            結果：<span class="text-blue-600 font-black text-2xl">${comboResults.bestResult.result.winner}</span>
                        </p>
                        <p class="text-sm text-slate-500 mt-2">
                            我方剩餘 ${comboResults.bestResult.result.myRemainingCount} 人
                        </p>
                    </div>
                    
                    <details class="mt-4">
                        <summary class="cursor-pointer text-sm font-bold text-amber-600">查看所有排列組合</summary>
                        <div class="mt-4 space-y-2 max-h-60 overflow-y-auto">
                            ${comboResults.allResults.map((r, i) => `
                                <div class="p-3 bg-white rounded-xl text-xs">
                                    <p class="font-bold mb-1">組合 ${i+1}</p>
                                    <p class="truncate text-slate-500">${r.order}</p>
                                    <p class="mt-2 ${r.result.winner === '我方' ? 'text-blue-600' : 'text-red-600'}">
                                        結果：${r.result.winner} (我方剩餘: ${r.result.myRemainingCount})
                                    </p>
                                </div>
                            `).join('')}
                        </div>
                    </details>
                </div>
            `;
            
            document.getElementById('combinationsResults').innerHTML = html;
        }
    </script>
</body>
</html>
