<!-- test4.html - 對戰分析儀表板 (完整優化版) -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 加入拖曳庫 SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <title>對戰分析 - 完整版</title>
    <style>
        .transition-all { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .theme-dark { background-color: #0f172a !important; color: #f8fafc !important; }
        .theme-dark .battle-card { background-color: #1e293b !important; border-color: #334155 !important; }
        .theme-dark table { color: #e2e8f0; }
        .theme-dark input, .theme-dark select { background-color: #0f172a !important; color: white !important; border-color: #475569 !important; }
        
        /* 凍結欄位效果 */
        .freeze-col {
            position: sticky;
            left: 0;
            background: inherit;
            z-index: 20;
            border-right: 2px solid #e2e8f0;
        }
        .freeze-col-2 {
            position: sticky;
            left: 60px;
            background: inherit;
            z-index: 20;
        }
        .freeze-col-3 {
            position: sticky;
            left: 200px;
            background: inherit;
            z-index: 20;
        }
        .freeze-col-4 {
            position: sticky;
            left: 320px;
            background: inherit;
            z-index: 20;
        }
        
        .table-container {
            overflow-x: auto;
            max-width: 100%;
            border-radius: 1rem;
            position: relative;
        }
        
        /* 表格樣式優化 */
        table {
            border-collapse: separate;
            border-spacing: 0;
            min-width: 1400px;
        }
        
        th {
            white-space: nowrap;
            padding: 12px 8px;
            text-align: center;
            background-color: #f8fafc;
            font-size: 0.75rem;
            font-weight: 700;
            color: #475569;
            border-bottom: 2px solid #e2e8f0;
        }
        
        td {
            padding: 10px 8px;
            vertical-align: middle;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .theme-dark th {
            background-color: #1e293b;
            color: #cbd5e1;
            border-bottom-color: #475569;
        }
        
        /* 數值欄位靠右對齊 */
        .text-right {
            text-align: right;
        }
        
        /* 欄位寬度控制 */
        .col-name { min-width: 80px; max-width: 120px; }
        .col-position { min-width: 70px; }
        .col-power { min-width: 90px; }
        .col-biSheng { min-width: 70px; }
        .col-talisman { min-width: 90px; }
        .col-scenario { min-width: 85px; }
        
        /* 拖曳樣式 */
        .drag-handle {
            cursor: grab;
            color: #94a3b8;
            font-size: 1.2rem;
            user-select: none;
            display: inline-block;
            width: 30px;
            text-align: center;
        }
        .drag-handle:active { cursor: grabbing; }
        .sortable-ghost {
            opacity: 0.4;
            background-color: #e2e8f0 !important;
        }
        .sortable-drag {
            opacity: 0.8;
            transform: rotate(2deg);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        /* 職位標籤 */
        .position-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .position-chairman { background-color: #fee2e2; color: #b91c1c; }
        .position-vice { background-color: #fed7aa; color: #9a3412; }
        .position-elite { background-color: #cffafe; color: #0e7490; }
        .position-member { background-color: #e2e8f0; color: #334155; }
        
        /* 客製化捲軸 */
        .table-container::-webkit-scrollbar {
            height: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        
        /* 彈窗樣式 (統一風格) */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            border-radius: 2.5rem;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .theme-dark .modal-content {
            background-color: #1e293b;
            color: white;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-12 transition-all" id="mainBody">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- 返回按鈕 -->
        <div class="mb-6">
            <button onclick="goBack()" class="flex items-center gap-2 text-slate-400 hover:text-indigo-500 transition-colors group">
                <span class="text-xl group-hover:-translate-x-1 transition-transform">←</span>
                <span class="font-bold">返回主選單</span>
            </button>
        </div>

        <!-- 測試標籤 -->
        <div class="mb-6">
            <span class="bg-amber-100 text-amber-600 text-xs font-bold px-4 py-2 rounded-full uppercase tracking-wider">🧪 測試實驗室 - 對戰分析 v4.0</span>
        </div>

        <!-- ========== 敵方商會選擇 ========== -->
        <div class="bg-white rounded-[2.5rem] shadow-lg p-6 border border-slate-100 battle-card">
            <h2 class="text-xl font-black mb-4 flex items-center gap-2">
                <span class="text-2xl">🏰</span> 
                <span>選擇敵方商會</span>
            </h2>
            <select id="enemyGuildSelect" class="w-full p-3 border-2 border-slate-100 rounded-xl focus:border-indigo-500 outline-none">
                <option value="">請選擇敵方商會...</option>
            </select>
        </div>

        <!-- ========== 敵方成員戰力分析表 ========== -->
        <div class="bg-white rounded-[2.5rem] shadow-lg p-6 border border-slate-100 battle-card">
            <h2 class="text-xl font-black mb-4 flex items-center gap-2">
                <span class="text-2xl">📊</span>
                <span>敵方成員戰力分析</span>
            </h2>
            <div class="table-container">
                <table class="w-full text-sm">
                    <thead>
                        <tr>
                            <th class="freeze-col">成員</th>
                            <th class="text-right">基礎戰力</th>
                            <th class="text-right bg-blue-50">①基礎</th>
                            <th class="text-right bg-green-50">②+募資</th>
                            <th class="text-right bg-amber-50">③+300%</th>
                            <th class="text-right bg-orange-50">④+300%+募</th>
                            <th class="text-right bg-purple-50">⑤+50%</th>
                            <th class="text-right bg-pink-50">⑥+50%+募</th>
                        </tr>
                    </thead>
                    <tbody id="enemyMemberTable">
                        <tr><td colspan="8" class="text-center p-6 text-slate-400">請先選擇敵方商會</td></tr>
                    </tbody>
                    <tfoot id="enemyTotalRow" class="bg-slate-100 font-bold">
                        <!-- 總和列 -->
                    </tfoot>
                </table>
            </div>
        </div>

        <!-- ========== 我方門客配置區 (可拖曳) ========== -->
        <div class="bg-white rounded-[2.5rem] shadow-lg p-6 border border-slate-100 battle-card">
            <h2 class="text-xl font-black mb-4 flex items-center gap-2">
                <span class="text-2xl">🛡️</span>
                <span>我方門客配置</span>
                <span class="text-xs font-normal text-slate-400 ml-2">(可拖曳 ⋮⋮ 調整順序)</span>
            </h2>
            
            <!-- 批次載入按鈕 -->
            <div class="mb-4 flex flex-wrap gap-2">
                <select id="batchLoadSelect" class="p-2 border rounded-lg text-sm">
                    <option value="">批次載入...</option>
                    <option value="max">載入最大戰力 (No.1)</option>
                    <option value="second">載入第二大戰力 (No.2)</option>
                    <option value="third">載入第三大戰力 (No.3)</option>
                </select>
                <button onclick="batchLoadMembers()" class="px-4 py-2 bg-indigo-100 text-indigo-600 rounded-lg text-sm font-bold hover:bg-indigo-200">
                    套用
                </button>
                <button onclick="resetMyOrder()" class="px-4 py-2 bg-slate-100 rounded-lg text-sm font-bold hover:bg-slate-200">
                    ⟲ 重置順序
                </button>
            </div>
            
            <div class="table-container">
                <table class="w-full text-sm">
                    <thead>
                        <tr>
                            <th class="freeze-col" style="width: 40px;"></th>
                            <th class="freeze-col-2 col-name">成員</th>
                            <th class="freeze-col-3 col-position">職位</th>
                            <th class="freeze-col-4 col-power text-right">基礎戰力</th>
                            <th class="col-biSheng">畢昇</th>
                            <th class="col-talisman">錦囊</th>
                            <th class="text-right bg-blue-50 col-scenario">①</th>
                            <th class="text-right bg-green-50 col-scenario">②</th>
                            <th class="text-right bg-amber-50 col-scenario">③</th>
                            <th class="text-right bg-orange-50 col-scenario">④</th>
                            <th class="text-right bg-purple-50 col-scenario">⑤</th>
                            <th class="text-right bg-pink-50 col-scenario">⑥</th>
                            <th class="text-center">伏兵</th>
                        </tr>
                    </thead>
                    <tbody id="myMembersTable" class="sortable-table">
                        <!-- 動態產生 -->
                    </tbody>
                </table>
            </div>
            <p class="text-xs text-slate-400 mt-2">💡 ①基礎職務+畢昇 ②+募資 ③+300% ④+300%+募 ⑤+50% ⑥+50%+募</p>
        </div>

        <!-- ========== 對戰模擬器 ========== -->
        <div class="bg-white rounded-[2.5rem] shadow-lg p-6 border border-slate-100 battle-card">
            <h2 class="text-xl font-black mb-4 flex items-center gap-2">
                <span class="text-2xl">⚔️</span>
                <span>對戰模擬器</span>
            </h2>
            
            <!-- 募資選擇 -->
            <div class="mb-4">
                <label class="block font-bold mb-2 text-sm">募資加成：</label>
                <div class="flex flex-wrap gap-3">
                    <label class="flex items-center gap-2 p-2 border rounded-lg text-sm">
                        <input type="radio" name="fundraising" value="none" checked> 無募資
                    </label>
                    <label class="flex items-center gap-2 p-2 border rounded-lg text-sm">
                        <input type="radio" name="fundraising" value="my"> 我方+10%
                    </label>
                    <label class="flex items-center gap-2 p-2 border rounded-lg text-sm">
                        <input type="radio" name="fundraising" value="enemy"> 敵方+10%
                    </label>
                </div>
            </div>
            
            <!-- 敵方錦囊情境 -->
            <div class="mb-4">
                <label class="block font-bold mb-2 text-sm">敵方錦囊情境：</label>
                <div class="flex flex-wrap gap-2">
                    <label class="flex items-center gap-1 p-2 border rounded-lg text-xs">
                        <input type="radio" name="enemyScenario" value="none" checked> 無錦囊
                    </label>
                    <label class="flex items-center gap-1 p-2 border rounded-lg text-xs">
                        <input type="radio" name="enemyScenario" value="all_50"> 全+50%
                    </label>
                    <label class="flex items-center gap-1 p-2 border rounded-lg text-xs">
                        <input type="radio" name="enemyScenario" value="all_300"> 全+300%
                    </label>
                    <label class="flex items-center gap-1 p-2 border rounded-lg text-xs">
                        <input type="radio" name="enemyScenario" value="light"> 輕度(1/3)
                    </label>
                    <label class="flex items-center gap-1 p-2 border rounded-lg text-xs">
                        <input type="radio" name="enemyScenario" value="heavy"> 重度(2/3)
                    </label>
                    <label class="flex items-center gap-1 p-2 border rounded-lg text-xs">
                        <input type="radio" name="enemyScenario" value="balanced"> 均衡(1/4)
                    </label>
                </div>
            </div>
            
            <!-- 模擬按鈕 -->
            <div class="flex flex-wrap gap-3 mb-4">
                <button onclick="simulateBattle()" class="px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold text-sm hover:bg-indigo-700">
                    ⚔️ 一般對戰模擬
                </button>
                <button onclick="simulateCombinations()" class="px-6 py-3 bg-amber-600 text-white rounded-xl font-bold text-sm hover:bg-amber-700">
                    🔄 排列組合模擬
                </button>
            </div>
            
            <!-- 模擬結果 -->
            <div id="simulateResults" class="mt-4"></div>
            <div id="combinationsResults" class="mt-4"></div>
        </div>

        <!-- 彈窗 (統一風格) -->
        <div id="messageModal" class="modal-backdrop hidden">
            <div class="modal-content">
                <div id="modalIcon" class="text-4xl mb-3 text-center">✅</div>
                <h3 id="modalTitle" class="text-lg font-black mb-2 text-center">提示</h3>
                <p id="modalMessage" class="text-sm text-slate-500 mb-4 text-center"></p>
                <button onclick="closeModal()" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700">
                    確定
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==================== 設定 ====================
        const SCRIPT_URL = '你的GAS部署網址';  // 請替換成實際的GAS網址
        
        // ==================== 戰力計算核心 ====================
        class BattlePowerCalculator {
            static calculateBasePower(basePower, position, biShengLevel) {
                const positionBonus = {
                    '會長': 0.3, '副會長': 0.15, '精英': 0.1, '成員': 0
                }[position] || 0;
                
                const biShengBonus = {
                    '無': 0, '無星': 0.05, '1星': 0.075, '2星': 0.1, '3星': 0.125
                }[biShengLevel] || 0;
                
                return basePower * (1 + positionBonus + biShengBonus);
            }
            
            static formatPower(power) {
                if (!power || power === 0) return '-';
                if (power >= 1000000000) {
                    return Math.floor(power / 100000000 * 100) / 100 + 'e';
                } else if (power >= 100000000) {
                    return Math.floor(power / 100000000 * 1000) / 1000 + 'e';
                } else {
                    return Math.floor(power / 10000 * 10) / 10 + '萬';
                }
            }
            
            static formatTotalPower(power) {
                if (!power || power === 0) return '-';
                if (power >= 100000000) {
                    return Math.floor(power / 100000000) + 'e';
                } else {
                    return Math.floor(power / 10000) + '萬';
                }
            }
            
            static calculateSixScenarios(member) {
                const basePower = Number(member.basePower) || 0;
                const g4 = this.calculateBasePower(basePower, member.position, member.biShengLevel);
                
                return {
                    name: member.name,
                    basePower: basePower,
                    baseDisplay: basePower ? this.formatPower(basePower) : '-',
                    scenario1: { value: g4, display: this.formatPower(g4) },
                    scenario2: { value: g4 + basePower * 0.1, display: this.formatPower(g4 + basePower * 0.1) },
                    scenario3: { value: g4 + basePower * 3, display: this.formatPower(g4 + basePower * 3) },
                    scenario4: { value: g4 + basePower * 3.1, display: this.formatPower(g4 + basePower * 3.1) },
                    scenario5: { value: g4 + basePower * 0.5, display: this.formatPower(g4 + basePower * 0.5) },
                    scenario6: { value: g4 + basePower * 0.6, display: this.formatPower(g4 + basePower * 0.6) }
                };
            }
            
            static getPositionClass(position) {
                const map = {
                    '會長': 'position-chairman',
                    '副會長': 'position-vice',
                    '精英': 'position-elite',
                    '成員': 'position-member'
                };
                return map[position] || 'position-member';
            }
        }

        // ==================== 全域變數 ====================
        let myMembers = [];
        let enemyMembers = [];
        let guildList = [];
        let originalMyMembers = [];
        let sortableInstance = null;

        // ==================== 初始化 ====================
        window.onload = function() {
            applyTheme();
            loadGuildList();
            loadMyMembers();
        };

        // ==================== 彈窗函數 ====================
        function showModal(title, message, isSuccess = true) {
            document.getElementById('modalIcon').innerText = isSuccess ? '✅' : '❌';
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('messageModal').classList.remove('hidden');
        }
        
        function closeModal() {
            document.getElementById('messageModal').classList.add('hidden');
        }

        // ==================== 主題套用 ====================
        function applyTheme() {
            try {
                const data = JSON.parse(sessionStorage.getItem('gameData'));
                if (data?.config?.CurrentTheme === 'dark') {
                    document.getElementById('mainBody').classList.add('theme-dark');
                }
            } catch (e) {}
        }

        function goBack() {
            location.href = sessionStorage.getItem('gameData') ? 'portal.html' : 'index.html';
        }

        // ==================== 載入商會列表 ====================
        async function loadGuildList() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getGuilds`);
                const data = await response.json();
                
                if (data.success) {
                    guildList = data.guilds || [];
                    const select = document.getElementById('enemyGuildSelect');
                    select.innerHTML = '<option value="">請選擇敵方商會...</option>' +
                        guildList.map(g => 
                            `<option value="${g.name}">${g.name} (${g.version})</option>`
                        ).join('');
                    
                    if (guildList.length === 0) {
                        showModal('提示', '目前沒有商會資料', false);
                    }
                    
                    select.addEventListener('change', (e) => {
                        if (e.target.value) {
                            loadEnemyMembers(e.target.value);
                        }
                    });
                } else {
                    showModal('錯誤', data.msg || '載入商會列表失敗', false);
                }
            } catch (error) {
                console.error('載入商會列表失敗:', error);
                showModal('錯誤', '無法連接到伺服器', false);
            }
        }

        // ==================== 載入敵方成員 ====================
        async function loadEnemyMembers(guildName) {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getGuildMembers&guildName=${encodeURIComponent(guildName)}`);
                const data = await response.json();
                
                if (data.success) {
                    enemyMembers = data.members || [];
                    renderEnemyTable();
                } else {
                    showModal('錯誤', data.msg || '載入敵方成員失敗', false);
                }
            } catch (error) {
                console.error('載入敵方成員失敗:', error);
                showModal('錯誤', '無法連接到伺服器', false);
            }
        }

        // ==================== 載入我方主戰力 ====================
        async function loadMyMembers() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getMyMain`);
                const data = await response.json();
                
                if (data.success) {
                    myMembers = (data.members || []).map(m => ({
                        ...m,
                        talisman: 'none',
                        ambushPower: null
                    }));
                    originalMyMembers = JSON.parse(JSON.stringify(myMembers));
                    myMembers = sortByPosition(myMembers);
                    renderMyTable();
                    initSortable();
                } else {
                    showModal('錯誤', data.msg || '載入我方成員失敗', false);
                }
            } catch (error) {
                console.error('載入我方成員失敗:', error);
                showModal('錯誤', '無法連接到伺服器', false);
            }
        }

        // ==================== 依職位排序 ====================
        function sortByPosition(members) {
            const positionOrder = { '會長': 1, '副會長': 2, '精英': 3, '成員': 4 };
            return [...members].sort((a, b) => 
                (positionOrder[a.position] || 999) - (positionOrder[b.position] || 999)
            );
        }

        // ==================== 批次載入 ====================
        async function batchLoadMembers() {
            const rank = document.getElementById('batchLoadSelect').value;
            if (!rank) {
                showModal('提示', '請選擇要載入的戰力', false);
                return;
            }
            
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getMyReserve&rank=${rank}`);
                const data = await response.json();
                
                if (data.success) {
                    let updateCount = 0;
                    data.members.forEach(newMember => {
                        const index = myMembers.findIndex(m => m.name === newMember.name);
                        if (index !== -1 && newMember.basePower > 0) {
                            myMembers[index].basePower = newMember.basePower;
                            updateCount++;
                        }
                    });
                    
                    renderMyTable();
                    showModal('成功', `已更新 ${updateCount} 筆資料`, true);
                } else {
                    showModal('錯誤', data.msg || '載入失敗', false);
                }
            } catch (error) {
                console.error('批次載入失敗:', error);
                showModal('錯誤', '無法連接到伺服器', false);
            }
        }

        // ==================== 重置順序 ====================
        function resetMyOrder() {
            myMembers = sortByPosition(originalMyMembers.map(m => ({...m})));
            renderMyTable();
            initSortable();
            showModal('提示', '順序已重置', true);
        }

        // ==================== 渲染敵方表格 ====================
        function renderEnemyTable() {
            if (!enemyMembers.length) {
                document.getElementById('enemyMemberTable').innerHTML = 
                    '<tr><td colspan="8" class="text-center p-6 text-slate-400">無成員資料</td></tr>';
                document.getElementById('enemyTotalRow').innerHTML = '';
                return;
            }
            
            const tbody = document.getElementById('enemyMemberTable');
            const scenarios = enemyMembers.map(m => BattlePowerCalculator.calculateSixScenarios(m));
            
            tbody.innerHTML = scenarios.map(s => `
                <tr class="hover:bg-slate-50">
                    <td class="freeze-col font-bold">${s.name}</td>
                    <td class="text-right">${s.baseDisplay}</td>
                    <td class="text-right bg-blue-50">${s.scenario1.display}</td>
                    <td class="text-right bg-green-50">${s.scenario2.display}</td>
                    <td class="text-right bg-amber-50">${s.scenario3.display}</td>
                    <td class="text-right bg-orange-50">${s.scenario4.display}</td>
                    <td class="text-right bg-purple-50">${s.scenario5.display}</td>
                    <td class="text-right bg-pink-50">${s.scenario6.display}</td>
                </tr>
            `).join('');
            
            const totals = [1,2,3,4,5,6].map(i => {
                const sum = scenarios.reduce((acc, s) => acc + s[`scenario${i}`].value, 0);
                return BattlePowerCalculator.formatTotalPower(sum);
            });
            
            document.getElementById('enemyTotalRow').innerHTML = `
                <tr>
                    <td class="freeze-col bg-slate-100 font-black">📊 總和</td>
                    <td class="text-right bg-slate-100">-</td>
                    <td class="text-right bg-blue-100 font-bold">${totals[0]}</td>
                    <td class="text-right bg-green-100 font-bold">${totals[1]}</td>
                    <td class="text-right bg-amber-100 font-bold">${totals[2]}</td>
                    <td class="text-right bg-orange-100 font-bold">${totals[3]}</td>
                    <td class="text-right bg-purple-100 font-bold">${totals[4]}</td>
                    <td class="text-right bg-pink-100 font-bold">${totals[5]}</td>
                </tr>
            `;
        }

        // ==================== 渲染我方表格 ====================
        function renderMyTable() {
            const tbody = document.getElementById('myMembersTable');
            
            tbody.innerHTML = myMembers.map((member, index) => {
                const s = BattlePowerCalculator.calculateSixScenarios(member);
                const positionClass = BattlePowerCalculator.getPositionClass(member.position);
                
                return `
                <tr class="hover:bg-slate-50" data-index="${index}" data-position="${member.position}">
                    <td class="freeze-col text-center">
                        <span class="drag-handle">⋮⋮</span>
                    </td>
                    <td class="freeze-col-2 font-bold">${member.name}</td>
                    <td class="freeze-col-3">
                        <span class="position-badge ${positionClass}">${member.position}</span>
                    </td>
                    <td class="freeze-col-4">
                        <div class="flex items-center justify-end">
                            <input type="number" value="${member.basePower}" 
                                   onchange="updateMember(${index}, 'basePower', this.value)"
                                   class="w-20 p-1 border rounded text-right text-sm">
                            <span class="text-xs text-slate-400 ml-1">${s.baseDisplay}</span>
                        </div>
                    </td>
                    <td>
                        <select onchange="updateMember(${index}, 'biShengLevel', this.value)" class="p-1 border rounded text-sm w-16">
                            <option value="無" ${member.biShengLevel === '無' ? 'selected' : ''}>無</option>
                            <option value="無星" ${member.biShengLevel === '無星' ? 'selected' : ''}>無星</option>
                            <option value="1星" ${member.biShengLevel === '1星' ? 'selected' : ''}>1星</option>
                            <option value="2星" ${member.biShengLevel === '2星' ? 'selected' : ''}>2星</option>
                            <option value="3星" ${member.biShengLevel === '3星' ? 'selected' : ''}>3星</option>
                        </select>
                    </td>
                    <td>
                        <select onchange="handleTalismanChange(${index}, this.value)" class="p-1 border rounded text-sm w-20">
                            <option value="none" ${member.talisman === 'none' ? 'selected' : ''}>無</option>
                            <option value="self_300" ${member.talisman === 'self_300' ? 'selected' : ''}>+300%</option>
                            <option value="self_50" ${member.talisman === 'self_50' ? 'selected' : ''}>+50%</option>
                            <option value="enemy_30" ${member.talisman === 'enemy_30' ? 'selected' : ''}>-30%</option>
                            <option value="ambush" ${member.talisman === 'ambush' ? 'selected' : ''}>伏兵</option>
                        </select>
                    </td>
                    <td class="text-right bg-blue-50">${s.scenario1.display}</td>
                    <td class="text-right bg-green-50">${s.scenario2.display}</td>
                    <td class="text-right bg-amber-50">${s.scenario3.display}</td>
                    <td class="text-right bg-orange-50">${s.scenario4.display}</td>
                    <td class="text-right bg-purple-50">${s.scenario5.display}</td>
                    <td class="text-right bg-pink-50">${s.scenario6.display}</td>
                    <td class="text-center">
                        <div id="ambush-${index}" class="${member.talisman === 'ambush' ? '' : 'hidden'}">
                            <input type="number" value="${member.ambushPower || ''}" 
                                   placeholder="戰力"
                                   onchange="updateAmbush(${index}, this.value)"
                                   class="w-16 p-1 border rounded text-sm">
                        </div>
                    </td>
                </tr>
            `}).join('');
        }

        // ==================== 初始化拖曳 ====================
        function initSortable() {
            const tbody = document.getElementById('myMembersTable');
            
            if (sortableInstance) {
                sortableInstance.destroy();
            }
            
            sortableInstance = new Sortable(tbody, {
                handle: '.drag-handle',
                animation: 150,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                onEnd: function(evt) {
                    const newOrder = [];
                    const rows = tbody.querySelectorAll('tr');
                    
                    rows.forEach(row => {
                        const index = row.getAttribute('data-index');
                        if (index !== null) {
                            newOrder.push(myMembers[parseInt(index)]);
                        }
                    });
                    
                    myMembers = newOrder;
                    
                    rows.forEach((row, idx) => {
                        row.setAttribute('data-index', idx);
                    });
                }
            });
        }

        // ==================== 更新成員資料 ====================
        function updateMember(index, field, value) {
            if (field === 'basePower') value = Number(value) || 0;
            myMembers[index][field] = value;
            
            if (field === 'position') {
                myMembers = sortByPosition(myMembers);
                renderMyTable();
                initSortable();
            }
        }

        function handleTalismanChange(index, value) {
            myMembers[index].talisman = value;
            const ambushDiv = document.getElementById(`ambush-${index}`);
            if (ambushDiv) {
                ambushDiv.classList.toggle('hidden', value !== 'ambush');
            }
        }

        function updateAmbush(index, value) {
            myMembers[index].ambushPower = Number(value) || 0;
        }

        // ==================== 模擬對戰 (暫為提示) ====================
        function simulateBattle() {
            if (!enemyMembers.length) {
                showModal('提示', '請先選擇敵方商會', false);
                return;
            }
            showModal('開發中', '對戰模擬功能開發中，請稍候', true);
        }

        function simulateCombinations() {
            if (!enemyMembers.length) {
                showModal('提示', '請先選擇敵方商會', false);
                return;
            }
            showModal('開發中', '排列組合功能開發中，請稍候', true);
        }
    </script>
</body>
</html>
