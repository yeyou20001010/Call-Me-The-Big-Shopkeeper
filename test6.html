<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交引風雲｜智慧買入決策工具</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; background-color: #EAE8E4; color: #4A4655; font-weight: 700; }
        [v-cloak] { display: none; }
        .card-std { background: #FBFBF9; border: 2px solid #D7D3CC; border-radius: 1.5rem; padding: 1.5rem; }
        .input-inline { background: #F4F2EE; border: 1px solid #D7D3CC; border-radius: 0.5rem; padding: 6px 10px; text-align: right; font-weight: 900; color: #5E548E; outline: none; font-size: 14px; width: 100%; }
        .custom-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: 1.5rem; box-shadow: 0 30px 60px -12px rgba(0,0,0,0.3); z-index: 100; width: 90%; max-width: 800px; padding: 1.5rem; border: 2px solid #5E548E; max-height: 85vh; overflow-y: auto; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 90; backdrop-filter: blur(3px); }
        .text-gain { color: #E53935 !important; }
        .text-loss { color: #00897B !important; }
        .row-label { font-size: 12px; color: #8E9AAF; font-weight: 900; margin-bottom: 2px; display: block; }
        .period-btn-small { background: #EAE8E4; border-radius: 2rem; padding: 0.25rem 0.75rem; text-align: center; font-weight: 900; cursor: pointer; transition: all 0.2s; border: 1px solid #D7D3CC; font-size: 0.8rem; }
        .period-btn-small.active { background: #5E548E; color: white; border-color: #5E548E; }
        canvas { background: #F4F2EE; border-radius: 0.75rem; border: 1px solid #D7D3CC; width:100%; height:auto; }
        th, td { text-align: center !important; vertical-align: middle !important; }
        .clickable-name { cursor: pointer; color: #5E548E; font-weight: 900; }
        .clickable-name:hover { text-decoration: underline; color: #FF9D6F; }
        .risk-red { color: #E53935; border-left: 3px solid #E53935; padding-left: 6px; }
        .risk-blue { color: #1E88E5; border-left: 3px solid #1E88E5; padding-left: 6px; }
        .risk-green { color: #43A047; border-left: 3px solid #43A047; padding-left: 6px; }
        .risk-missing { color: #9E9E9E; border-left: 3px solid #9E9E9E; padding-left: 6px; }
        .sort-btn { cursor: pointer; user-select: none; }
        .sort-btn:hover { opacity: 0.7; }
        .stop-loss-row { background-color: rgba(229, 57, 53, 0.1); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div id="app" v-cloak class="max-w-[1600px] mx-auto">
        
        <!-- 主內容（簡化版，先確保能跑） -->
        <div class="bg-white rounded-[2rem] shadow-md border-2 border-[#D7D3CC] p-6 mb-6">
            <div class="flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-[#5E548E] rounded-2xl flex items-center justify-center text-white text-2xl">📈</div>
                    <h1 class="text-2xl font-black text-[#5E548E]">交引風雲｜智慧買入決策工具</h1>
                </div>
                <div class="flex gap-3 flex-wrap">
                    <button onclick="location.href='portal.html'" class="bg-[#6D6875] text-white px-4 py-2 rounded-xl text-sm font-black">🏠 返回</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-12">
                <div class="card-std text-center p-12">
                    <p class="text-green-600 font-black text-xl">✅ 工具已成功載入</p>
                    <p class="text-gray-400 mt-2">完整功能版本正在修復中，請稍候。</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        const { createApp } = Vue;
        createApp({
            data() { return { message: 'Vue 已啟動' } },
            mounted() { console.log('Vue 正常運作') }
        }).mount('#app');
    </script>
</body>
</html>
