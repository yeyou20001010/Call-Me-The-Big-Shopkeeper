<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&family=Varela+Round&display=swap" rel="stylesheet">
    <title>體力監控中心</title>
    <style>
        :root {
            --highlight-pink: #FF9D6F; 
            --full-green: #02C874;     
            --morandi-bg: #FBFBF9;
            --tag-bg: #F0EFEB;
            --line-green: #06C755;
        }
        body { 
            font-family: 'Varela Round', 'Noto Sans TC', sans-serif;
            background-color: #EAE8E4; 
            color: #6D6875;
        }
        .card-standard { background-color: var(--morandi-bg); border: 1px solid #D7D3CC; }
        .card-full-highlight { 
            background-color: var(--morandi-bg) !important; 
            border: 4px solid var(--full-green) !important; 
            box-shadow: 0 4px 15px rgba(2, 200, 116, 0.15); 
        }
        .text-status-pink { color: var(--highlight-pink); } 
        .text-full-green { color: var(--full-green); }
        .tag-label { 
            background-color: var(--tag-bg); 
            color: #5E548E; 
            border: 1px solid #D7D3CC;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 900;
        }
        .progress-ring-circle {
            transition: stroke-dashoffset 0.8s ease-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        @keyframes blinker { 50% { opacity: 0.3; } }
        .animate-guide { animation: blinker 2s linear infinite; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #D7D3CC; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--line-green); }
        input:checked + .slider:before { transform: translateX(22px); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">
<div class="max-w-6xl mx-auto">
        <div class="flex flex-col lg:flex-row justify-between items-center mb-10 bg-[#FBFBF9] p-8 rounded-[2rem] shadow-sm border border-[#D7D3CC] gap-6">
            <div class="flex items-center gap-5">
                <div class="w-16 h-16 bg-[#6D6875] rounded-2xl flex items-center justify-center text-[#F4F2EE] text-3xl font-black shadow-inner">⚡</div>
                <div>
                    <h2 class="text-3xl font-black text-[#5E548E] tracking-tight">體力監控中心</h2>
                    <p class="text-xs font-bold text-[#8E9AAF] tracking-widest uppercase opacity-70">Stamina Real-time Monitor</p>
                </div>
            </div>
            
            <div class="flex flex-col lg:flex-row gap-3 items-center">
                <div class="flex items-center bg-[#F0EFEB] rounded-2xl p-1 border border-[#D7D3CC] w-full lg:w-auto">
                    <button onclick="changeSort(-1)" class="p-3 hover:bg-white rounded-xl transition text-[#8E9AAF] font-bold">❮</button>
                    <div class="px-4 min-w-[150px] text-center flex-1">
                        <p class="text-[10px] font-black text-[#A5A5A5] uppercase">排序方式</p>
                        <span id="sortModeText" class="font-black text-sm text-[#6D6875]">按活動 (預設)</span>
                    </div>
                    <button onclick="changeSort(1)" class="p-3 hover:bg-white rounded-xl transition text-[#8E9AAF] font-bold">❯</button>
                </div>
                
                <div class="grid grid-cols-2 lg:flex gap-3 w-full lg:w-auto">
                    <button onclick="openNotifyModal()" class="bg-[#06C755] text-white px-4 py-4 rounded-2xl font-black shadow-sm hover:bg-[#05B34C] transition-all active:scale-95 text-sm whitespace-nowrap">🔔 通知設定</button>
                    <button onclick="openManageModal()" class="bg-[#B8B0A5] text-white px-4 py-4 rounded-2xl font-black shadow-sm hover:bg-[#A69D92] transition-all active:scale-95 text-sm whitespace-nowrap">👥 名單管理</button>
                    <button onclick="askClearAll()" class="bg-[#AF7A7D] text-white px-4 py-4 rounded-2xl font-black shadow-sm hover:bg-[#9B6B6E] transition-all active:scale-95 text-sm whitespace-nowrap">🗑️ 全部清空</button>
                    <button onclick="window.location.replace('portal.html')" class="bg-[#6D6875] text-white px-4 py-4 rounded-2xl font-black shadow-sm hover:bg-[#5A5562] transition-all active:scale-95 text-sm whitespace-nowrap">返回選單</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">
            <div class="xl:col-span-1">
                <div class="bg-[#FBFBF9] p-8 rounded-[2.5rem] shadow-sm border border-[#D7D3CC] sticky top-10">
                    <h3 class="text-lg font-black text-[#6D6875] mb-6 border-b border-[#F0EFEB] pb-4">📅 活動選擇</h3>
                    <select id="activitySelect" class="w-full p-4 bg-white rounded-2xl font-black text-[#8E9AAF] border border-[#D7D3CC] mb-4 outline-none focus:ring-2 focus:ring-[#B8B0A5] transition-all cursor-pointer"></select>
                    <div class="bg-[#F4F2EE] p-5 rounded-2xl space-y-2 text-sm font-bold">
                        <div class="flex justify-between"><span class="text-[#A5A5A5]">恢復速率</span><span id="rateDetail" class="text-[#6D6875]">--</span></div>
                        <div class="flex justify-between"><span class="text-[#A5A5A5]">體力上限</span><span id="maxDetail" class="text-[#6D6875]">--</span></div>
                    </div>
                    <button onclick="openBatchModal()" class="w-full mt-8 bg-[#8E9AAF] text-white py-5 rounded-[2rem] text-lg font-black shadow-md hover:bg-[#7D7684] transition-all active:scale-95">🚀 批量加入監測</button>
                </div>
            </div>

            <div class="xl:col-span-3">
                <div id="monitorGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
                <div id="emptyDisplay" class="hidden text-center py-40 bg-[#FBFBF9] rounded-[3rem] border-4 border-dashed border-[#D7D3CC]">
                    <div class="text-6xl mb-6 opacity-20">💤</div>
                    <p class="text-[#D7D3CC] font-black text-2xl">目前無進行中的監測項目</p>
                    <p class="text-[#D7D3CC] font-bold mt-2">請從左側選擇活動並加入人物</p>
                </div>
            </div>
        </div>
    </div>

    <div id="notifyModal" class="fixed inset-0 bg-[#6D6875]/90 hidden items-center justify-center p-4 z-[110] backdrop-blur-md">
        <div class="bg-[#FBFBF9] w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl relative border border-[#D7D3CC]">
            <h3 class="text-xl font-black mb-2 text-[#5E548E]">LINE 個人通知設定</h3>
            <p class="text-[10px] font-bold text-[#8E9AAF] mb-6 uppercase tracking-widest">Personalize Your Notifications</p>
            <div class="space-y-4">
                <div class="flex items-center justify-between bg-white p-5 rounded-3xl border border-[#D7D3CC]">
                    <span class="font-black text-[#6D6875]">開啟 LINE 提醒</span>
                    <label class="switch">
                        <input type="checkbox" id="lineNotifyToggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="bg-white p-5 rounded-3xl border border-[#D7D3CC]">
                    <p class="text-[9px] font-black text-[#A5A5A5] mb-2 uppercase">您的個人通知 ID</p>
                    <input id="userIdInput" type="text" placeholder="請貼上 U 開頭的 ID..." class="w-full p-4 bg-[#F4F2EE] border border-[#D7D3CC] rounded-xl text-xs font-bold text-[#6D6875] outline-none mb-3">
                    <a href="https://lin.ee/P511ju5" target="_blank" class="block w-full text-center py-3 bg-[#F0EFEB] text-[#8E9AAF] rounded-xl text-[10px] font-black hover:bg-[#EAE8E4] transition-all">
                        💬 點此加入好友後，點擊選單或輸入「查詢ID」以獲取個人代碼
                    </a>
                </div>
            </div>
            <button onclick="saveNotifySettings()" class="w-full mt-8 py-5 bg-[#06C755] text-white rounded-[1.5rem] font-black shadow-lg">儲存設定並測試</button>
            <button onclick="closeModal('notifyModal')" class="w-full mt-3 py-2 text-[#A5A5A5] font-bold text-sm">取消</button>
        </div>
    </div>

    <div id="customPromptModal" class="fixed inset-0 bg-[#6D6875]/90 hidden items-center justify-center p-4 z-[120] backdrop-blur-md">
        <div class="bg-[#FBFBF9] w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl relative border border-[#D7D3CC]">
            <h3 id="promptTitle" class="text-xl font-black mb-4 text-[#5E548E]">提示</h3>
            <p id="promptSub" class="text-sm font-bold text-[#8E9AAF] mb-4"></p>
            <input id="promptInput" type="text" class="w-full p-4 bg-white border border-[#D7D3CC] rounded-2xl font-bold mb-6 outline-none focus:ring-2 focus:ring-[#FF9D6F]">
            <div class="flex gap-3">
                <button onclick="closeModal('customPromptModal')" class="flex-1 py-4 bg-[#D7D3CC] text-white rounded-2xl font-black hover:bg-[#C2BEB6]">取消</button>
                <button id="promptConfirmBtn" class="flex-1 py-4 bg-[#FF9D6F] text-white rounded-2xl font-black hover:bg-[#E88D5F]">確認</button>
            </div>
        </div>
    </div>

    <div id="manageModal" class="fixed inset-0 bg-[#6D6875]/90 hidden items-center justify-center p-4 z-50 backdrop-blur-md">
        <div class="bg-[#FBFBF9] w-full max-w-2xl rounded-[2.5rem] md:rounded-[3rem] p-6 md:p-10 shadow-2xl relative flex flex-col max-h-[90vh] border border-[#D7D3CC]">
            <button onclick="closeModal('manageModal')" class="absolute top-6 right-6 md:top-10 md:right-10 text-[#D7D3CC] text-3xl hover:text-[#6D6875]">✕</button>
            <h3 class="text-2xl font-black mb-6 text-[#5E548E]">名單與群組管理</h3>
            <div class="flex flex-wrap gap-2 mb-8 bg-white p-2 rounded-2xl border border-[#D7D3CC]">
                <input id="newGroupName" type="text" placeholder="輸入新群組名稱..." class="flex-1 min-w-[150px] bg-transparent p-4 outline-none font-bold">
                <button onclick="addGroup()" class="bg-[#8E9AAF] text-white px-6 md:px-8 py-3 rounded-xl font-black hover:bg-[#7D7684] transition-all active:scale-95 whitespace-nowrap">建立群組</button>
            </div>
            <div id="groupListArea" class="overflow-y-auto flex-1 space-y-6 pr-2"></div>
        </div>
    </div>

    <div id="batchModal" class="fixed inset-0 bg-[#6D6875]/90 hidden items-center justify-center p-4 z-50 backdrop-blur-md">
        <div class="bg-[#FBFBF9] w-full max-w-2xl rounded-[3rem] p-10 shadow-2xl relative flex flex-col max-h-[90vh] border border-[#D7D3CC]">
            <button onclick="closeModal('batchModal')" class="absolute top-10 right-10 text-[#D7D3CC] text-3xl">✕</button>
            <h3 class="text-2xl font-black mb-2 text-[#5E548E]">批量加入監測</h3>
            <p id="batchActName" class="text-sm font-bold text-[#8E9AAF] mb-4"></p>
            <div class="flex justify-end gap-3 mb-4">
                <button onclick="toggleAllBatch(true)" class="text-xs font-black text-indigo-500 bg-indigo-50 px-3 py-1 rounded-lg">全選</button>
                <button onclick="toggleAllBatch(false)" class="text-xs font-black text-[#AF7A7D] bg-red-50 px-3 py-1 rounded-lg">取消全選</button>
            </div>
            <div id="batchInputList" class="overflow-y-auto flex-1 space-y-6 mb-8 pr-2"></div>
            <button onclick="submitBatch()" class="w-full bg-[#8E9AAF] text-white py-6 rounded-[2rem] text-xl font-black shadow-lg hover:bg-[#7D7684]">確認並開始監測</button>
        </div>
    </div>

<script>
const MY_GAS_URL = "https://script.google.com/macros/s/AKfycbxna2VNkReOpEGTZsYq1LhgAd6zr0YfMRk_ADDn-js-2l9029KV8hWBhj2oZjfmaXxxsA/exec";

let activities = [];
let db = JSON.parse(localStorage.getItem('stamina_v15_db')) || { groups: [{ id: 'default', name: '未分類人物', members: [] }] };
let monitors = JSON.parse(localStorage.getItem('stamina_v15_active')) || [];
let sortMode = 0; 
const sortTexts = ["按活動 (預設)", "按回滿時長", "按群組名稱", "按人物名稱"];

let notifySettings = JSON.parse(localStorage.getItem('stamina_notify_cfg')) || { line: false, userId: "" };
let notifiedSet = new Set();

window.onload = function() {
    const gameData = JSON.parse(sessionStorage.getItem('gameData'));
    if(!gameData) return location.href = "index.html"; 
    
    activities = gameData.activities;
    const select = document.getElementById('activitySelect');

    activities.forEach((act, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = act.name;
        select.appendChild(opt);
    });

    select.onchange = () => {
        const act = activities[select.value];
        const regainVal = act.regain || 1;

        document.getElementById('rateDetail').innerText =
            `${act.minPerStamina} 分鐘 / ${regainVal} 體`;

        document.getElementById('maxDetail').innerText =
            `${act.maxStamina} 體`;

        // ⭐ 新增：理論回滿時長（從0開始算）
        let fullDetailEl = document.getElementById('fullDetail');

        if (!fullDetailEl) {
            const box = document.createElement('div');
            box.className = "flex justify-between";
            box.innerHTML = `
                <span class="text-[#A5A5A5]">回滿時長</span>
                <span id="fullDetail" class="text-[#6D6875]"></span>
            `;
            document.getElementById('maxDetail')
                .parentElement
                .parentElement
                .appendChild(box);
            fullDetailEl = document.getElementById('fullDetail');
        }

        const fullHours =
            (act.maxStamina / regainVal * act.minPerStamina) / 60;

        fullDetailEl.innerText =
            `${fullHours.toFixed(1)} 小時 (理論)`;
    };

    select.dispatchEvent(new Event('change'));

    document.getElementById('lineNotifyToggle').checked = notifySettings.line;
    document.getElementById('userIdInput').value = notifySettings.userId || "";

    renderMonitoring();
    setInterval(renderMonitoring, 1000);
};

function renderMonitoring() {
            const grid = document.getElementById('monitorGrid');
            if(monitors.length === 0) {
                grid.innerHTML = "";
                document.getElementById('emptyDisplay').classList.remove('hidden');
                return;
            }
            document.getElementById('emptyDisplay').classList.add('hidden');

            const now = Date.now();
            let list = monitors.map((m) => {
                const act = activities[m.actIdx];
                const mins = (now - m.startTime) / 60000;
                
                // 核心邏輯：計算回體數量
                const rFactor = Number(act.regain) || 1; 

                // 目前體力：初始值 + (經過的完整恢復週期數 * 每次恢復體力)
                let current = Math.min(act.maxStamina, Math.max(0, m.initStamina + Math.floor(mins / act.minPerStamina) * rFactor));
                const isFull = current >= act.maxStamina;
                
                // 剩餘秒數計算
                let remSec = 0;
                if (!isFull) {
                    const needed = act.maxStamina - current;
                    const neededTimes = Math.ceil(needed / rFactor);
                    remSec = (neededTimes * act.minPerStamina * 60) - ((mins % act.minPerStamina) * 60);
                }

                if(!isFull && notifySettings.line && notifySettings.userId) {

    const targetTime = now + (remSec * 1000);

    const mKey = `${m.charId}-${m.actIdx}`;

    if (!notifiedSet.has(mKey)) {

        queueAddToSheet({
            charId: m.charId,
            charName: m.charName,
            actName: act.name,
            targetTime: targetTime
        });

        notifiedSet.add(mKey);
    }

} else if (isFull) {
    notifiedSet.delete(`${m.charId}-${m.actIdx}`);
}

                return { ...m, current, isFull, remSec, actMax: act.maxStamina, actName: act.name, groupName: getGroupNameByCharId(m.charId) };
            });

            if(sortMode === 0) list.sort((a,b) => a.actName.localeCompare(b.actName));
            else if(sortMode === 1) list.sort((a,b) => a.remSec - b.remSec);
            else if(sortMode === 2) list.sort((a,b) => a.groupName.localeCompare(b.groupName));
            else if(sortMode === 3) list.sort((a,b) => a.charName.localeCompare(b.charName));

            grid.innerHTML = list.map(m => {
                const percent = (m.current / m.actMax) * 100;
                const ringColor = m.isFull ? '#02C874' : '#FF9D6F';
                const textColor = m.isFull ? 'text-full-green' : 'text-status-pink';
                
                let countdownText = m.isFull ? "體力已回滿" : 
                    `${Math.floor(m.remSec/3600)}時 ${Math.floor((m.remSec%3600)/60)}分 ${Math.floor(m.remSec%60)}秒`;
                
                // 恢復 YYYY/M/D 完整格式
                let targetDate = new Date(now + m.remSec * 1000);
                let fullTimeLabel = m.isFull ? "狀態：體力已充滿" : 
                    `預計回滿時間：${targetDate.getFullYear()}/${targetDate.getMonth()+1}/${targetDate.getDate()} ${targetDate.getHours().toString().padStart(2,'0')}:${targetDate.getMinutes().toString().padStart(2,'0')}`;

                return `
                <div class="${m.isFull?'card-full-highlight':'card-standard'} p-8 rounded-[2.5rem] flex flex-col relative transition-all duration-500 shadow-sm">
                    <button onclick="removeMonitor('${m.charId}', ${m.actIdx})" class="absolute top-6 right-8 text-[#D7D3CC] hover:text-[#AF7A7D] text-2xl transition-colors">✕</button>
                    <div class="flex gap-2 mb-3">
                        <span class="tag-label">${m.actName}</span>
                        <span class="tag-label">${m.groupName}</span>
                    </div>
                    <div class="flex items-start justify-between mb-6">
                        <h4 class="text-2xl font-black text-[#6D6875]">${m.charName}</h4>
                        <div class="flex flex-col items-center">
                            <div onclick="quickUpdateStamina('${m.charId}', ${m.actIdx}, ${m.actMax})" class="relative w-20 h-20 cursor-pointer active:scale-90 transition-transform">
                                <svg class="w-20 h-20">
                                    <circle class="text-[#F0EFEB]" stroke-width="8" stroke="currentColor" fill="transparent" r="32" cx="40" cy="40"/>
                                    <circle style="stroke: ${ringColor}" class="progress-ring-circle" stroke-width="8" stroke-dasharray="201" stroke-dashoffset="${201 - (201 * percent / 100)}" stroke-linecap="round" fill="transparent" r="32" cx="40" cy="40"/>
                                </svg>
                                <div class="absolute inset-0 flex flex-col items-center justify-center font-black">
                                    <span class="text-xl text-[#6D6875] leading-none">${m.current}</span>
                                    <span class="text-[7px] text-[#A5A5A5] mt-1 animate-guide">刷新體力</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white/40 p-5 rounded-[1.5rem] border border-[#D7D3CC]/30">
                        <p class="text-3xl font-black ${textColor} tracking-tighter mb-1">${countdownText}</p>
                        <p class="text-[11px] font-bold text-[#8E9AAF] uppercase tracking-wider">${fullTimeLabel}</p>
                    </div>
                </div>`;
            }).join('');
        }

        function quickUpdateStamina(charId, actIdx, max) { 
            openCustomPrompt("快速刷新體力", `輸入目前的體力 (上限：${max})`, "0", false, (v) => { 
                const n = parseInt(v); 
                if(!isNaN(n) && n >= 0){ 
                    const i = monitors.findIndex(m=>m.charId===charId&&m.actIdx==actIdx); 
                    if(i>-1){ 
                        monitors[i].initStamina = Math.min(n, max); 
                        monitors[i].startTime = Date.now(); // 修正點：從輸入體力這一刻起重計恢復週期
                        saveActive(); renderMonitoring(); 
                    }
                }
            }); 
        }

        async function saveNotifySettings() {
        
            notifySettings.line = document.getElementById('lineNotifyToggle').checked;
            notifySettings.userId = document.getElementById('userIdInput').value.trim();
        
            localStorage.setItem('stamina_notify_cfg', JSON.stringify(notifySettings));
        
            try {
                await fetch(MY_GAS_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({
                        action: "updateNotify",
                        userId: notifySettings.userId,
                        enabled: notifySettings.line
                    })
                });
            } catch (err) {
                console.error("Notify Update Failed", err);
            }
        
            closeModal('notifyModal');
        }

        async function sendLineMsg(msg) {
            if(!notifySettings.line || !notifySettings.userId || !MY_GAS_URL) return;
            try {
                await fetch(MY_GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ userId: notifySettings.userId, message: msg })
                });
            } catch (e) { console.error("LINE Notify Failed", e); }
        }

        function triggerFullNotification(charName, actName) {
            sendLineMsg(`⚡ 體力回滿：\n角色：${charName}\n活動：${actName}`);
        }

        async function queueAddToSheet(data) {
            try {
                await fetch(MY_GAS_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({
                        action: "queueAdd",
                        userId: notifySettings.userId,
                        charId: data.charId,
                        charName: data.charName,
                        actName: data.actName,
                        targetTime: data.targetTime
                    })
                });
            } catch (err) {
                console.error("Queue Add Failed", err);
            }
        }

        let dragInfo = null;
        function handleDragStart(e, gid, mi) { dragInfo = { gid, mi }; e.target.classList.add('dragging'); }
        function handleDragEnd(e) { e.target.classList.remove('dragging'); }

        function setupDragAndDrop() {
            const zones = document.querySelectorAll('.drop-zone');
            zones.forEach(zone => {
                zone.ondragover = e => e.preventDefault();
                zone.ondrop = e => {
                    e.preventDefault();
                    if (!dragInfo) return;
                    const targetGid = zone.dataset.gid;
                    const sGroup = db.groups.find(g => g.id === dragInfo.gid);
                    const tGroup = db.groups.find(g => g.id === targetGid);
                    const [movingItem] = sGroup.members.splice(dragInfo.mi, 1);
                    
                    const container = zone.querySelector('.member-list');
                    const dropResult = getInsertPosition(container, e.clientX, e.clientY);
                    
                    if (!dropResult.element) { tGroup.members.push(movingItem); }
                    else {
                        const targetName = dropResult.element.querySelector('span').innerText;
                        const targetIdx = tGroup.members.findIndex(m => m.name === targetName);
                        const finalIdx = dropResult.after ? targetIdx + 1 : targetIdx;
                        tGroup.members.splice(finalIdx, 0, movingItem);
                    }
                    saveDB(); renderManageUI(); renderMonitoring(); dragInfo = null;
                };
            });
        }

        function getInsertPosition(container, x, y) {
            const items = [...container.querySelectorAll('.member-item:not(.dragging)')];
            let closest = { distance: Number.POSITIVE_INFINITY, element: null, after: false };
            items.forEach(child => {
                const box = child.getBoundingClientRect();
                const centerX = box.left + box.width / 2;
                const centerY = box.top + box.height / 2;
                const distance = Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2);
                if (distance < closest.distance) {
                    const isAfter = (y > centerY + 5) || (y > box.top && x > centerX + 10);
                    closest = { distance, element: child, after: isAfter };
                }
            });
            return closest;
        }

        function renderManageUI() {
            const area = document.getElementById('groupListArea');
            area.innerHTML = db.groups.map((g, gi) => `
                <div class="bg-[#F4F2EE] p-6 rounded-[2rem] border border-[#D7D3CC] drop-zone" data-gid="${g.id}">
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-3">
                            <span class="text-xl font-black text-[#6D6875]">${g.name}</span>
                            ${g.id!=='default'?`<button onclick="editGroupName('${g.id}')" class="fat-pencil-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1);"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg></button>`:''}
                        </div>
                        <div class="flex gap-2">
                            <button onclick="askClearGroup('${g.id}')" class="text-xs text-[#AF7A7D] bg-white border border-[#AF7A7D] px-3 py-1.5 rounded-lg font-black hover:bg-red-50">清空</button>
                            ${g.id!=='default'?`<button onclick="askRemoveGroup(${gi})" class="text-xs text-white bg-[#AF7A7D] px-3 py-1.5 rounded-lg font-black hover:bg-[#9B6B6E]">刪除</button>`:''}
                        </div>
                    </div>
                    <div class="flex gap-2 mb-4 bg-white/50 p-1.5 rounded-xl border border-dashed border-[#D7D3CC]">
                        <input type="text" placeholder="新增人物..." class="flex-1 p-3 rounded-lg text-sm font-bold border-none outline-none bg-white shadow-inner">
                        <button onclick="addMemberInLine(this, '${g.id}')" class="bg-[#8E9AAF] text-white px-5 rounded-lg text-xs font-black hover:bg-[#7D7684]">新增</button>
                    </div>
                    <div class="grid grid-cols-2 gap-3 min-h-[50px] member-list">
                        ${g.members.map((m, mi) => `
                            <div draggable="true" ondragstart="handleDragStart(event, '${g.id}', ${mi})" ondragend="handleDragEnd(event)"
                                 class="member-item bg-white p-3 rounded-xl text-sm font-black flex justify-between items-center border border-[#D7D3CC] cursor-move shadow-sm hover:shadow-md transition-all">
                                <span class="truncate pr-2">${m.name}</span>
                                <button onclick="removeMember('${g.id}', ${mi})" class="text-[#D7D3CC] hover:text-[#AF7A7D]">✕</button>
                            </div>`).join('')}
                    </div>
                </div>`).join('');
            setupDragAndDrop();
        }

        function saveDB() { localStorage.setItem('stamina_v15_db', JSON.stringify(db)); }
        function saveActive() { localStorage.setItem('stamina_v15_active', JSON.stringify(monitors)); }
        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }
        function openManageModal() { renderManageUI(); document.getElementById('manageModal').classList.replace('hidden', 'flex'); }
        function openNotifyModal() { document.getElementById('notifyModal').classList.replace('hidden', 'flex'); }
        
        function addGroup() { 
            const n = document.getElementById('newGroupName').value; 
            if(n){ db.groups.push({id:'g'+Date.now(), name:n, members:[]}); document.getElementById('newGroupName').value=""; saveDB(); renderManageUI(); }
        }
        
        function addMemberInLine(btn, gid) { 
            const inp = btn.previousElementSibling; 
            if(inp.value){ db.groups.find(g=>g.id===gid).members.push({name:inp.value, id:'c'+Date.now()}); inp.value=""; saveDB(); renderManageUI(); }
        }

        function removeMember(gid, mi) { const g = db.groups.find(g=>g.id===gid); g.members.splice(mi,1); saveDB(); renderManageUI(); }

        function editGroupName(gid) { 
            const g = db.groups.find(g => g.id === gid); 
            openCustomPrompt("編輯群組名稱", "請輸入新名稱", g.name, false, (n) => { 
                if(n && n.trim() !== ""){ g.name = n.trim(); saveDB(); renderManageUI(); renderMonitoring(); }
            }); 
        }

        function getGroupNameByCharId(id) { for (let g of db.groups) { if (g.members.some(m => m.id === id)) return g.name; } return "未分類"; }

        function changeSort(dir) { sortMode = (sortMode + dir + 4) % 4; document.getElementById('sortModeText').innerText = sortTexts[sortMode]; renderMonitoring(); }

        function askClearAll() { openCustomPrompt("確定清空？", "這將移除主介面上所有正在監測的項目。", "", true, () => { monitors = []; saveActive(); renderMonitoring(); }); }

        function askClearGroup(gid) { openCustomPrompt("清空成員？", "將移除此群組內的所有人物。", "", true, () => { db.groups.find(g=>g.id===gid).members = []; saveDB(); renderManageUI(); }); }

        function askRemoveGroup(gi) { openCustomPrompt("刪除群組？", "這將永久刪除此群組及其成員。", "", true, () => { db.groups.splice(gi,1); saveDB(); renderManageUI(); }); }

        function removeMonitor(charId, actIdx) { monitors = monitors.filter(m => !(m.charId === charId && m.actIdx == actIdx)); saveActive(); renderMonitoring(); }

        function openBatchModal() {
            const actIdx = document.getElementById('activitySelect').value;
            const act = activities[actIdx];
            document.getElementById('batchActName').innerText = `正在為「${act.name}」分配人物`;
            document.getElementById('batchInputList').innerHTML = db.groups.map(g => `
                <div class="bg-[#F4F2EE] p-5 rounded-[2rem] border border-[#D7D3CC]">
                    <div class="flex justify-between items-center mb-4 border-b border-[#D7D3CC] pb-2">
                        <span class="font-black text-[#6D6875]">${g.name}</span>
                        <div class="flex gap-2">
                            <button onclick="toggleGroupBatch('${g.id}', true)" class="text-[10px] font-black text-indigo-500 hover:underline">全選</button>
                            <button onclick="toggleGroupBatch('${g.id}', false)" class="text-[10px] font-black text-[#AF7A7D] hover:underline">取消</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 gap-2" data-batch-gid="${g.id}">
                        ${g.members.map(m => `
                            <div class="flex items-center gap-4 bg-white p-4 rounded-xl shadow-sm">
                                <input type="checkbox" class="char-cb w-6 h-6 accent-[#FF9D6F]" data-name="${m.name}" data-id="${m.id}">
                                <span class="flex-1 font-black text-[#6D6875]">${m.name}</span>
                                <div class="flex items-center gap-2">
                                    <span class="text-[10px] font-black text-[#A5A5A5]">起始體力</span>
                                    <input type="number" min="0" class="stamina-input w-20 p-2 bg-[#F4F2EE] rounded-lg text-center font-black outline-none border-none" value="0">
                                </div>
                            </div>`).join('')}
                    </div>
                </div>`).join('');
            document.getElementById('batchModal').classList.replace('hidden', 'flex');
        }

        function toggleAllBatch(c) { document.querySelectorAll('.char-cb').forEach(cb => cb.checked = c); }
        function toggleGroupBatch(gid, c) { document.querySelectorAll(`[data-batch-gid="${gid}"] .char-cb`).forEach(cb => cb.checked = c); }

        function submitBatch() {
            const actIdx = document.getElementById('activitySelect').value;
            document.querySelectorAll('.char-cb:checked').forEach(cb => {
                const row = cb.closest('.flex');
                const val = parseInt(row.querySelector('.stamina-input').value) || 0;
                const charId = cb.dataset.id;
                const data = { charId, charName: cb.dataset.name, actIdx, initStamina: val, startTime: Date.now() };
                const idx = monitors.findIndex(m => m.charId === charId && m.actIdx == actIdx);
                if(idx > -1) monitors[idx] = data; else monitors.push(data);
            });
            saveActive(); closeModal('batchModal'); renderMonitoring();
        }

        function openCustomPrompt(t,s,d,c,f) {
            document.getElementById('promptTitle').innerText=t; 
            document.getElementById('promptSub').innerText=s;
            const inp=document.getElementById('promptInput'); 
            inp.style.display=c?'none':'block'; 
            inp.value=d||"";
            document.getElementById('customPromptModal').classList.replace('hidden','flex');
            document.getElementById('promptConfirmBtn').onclick=()=>{f(inp.value); closeModal('customPromptModal');};
        }
    </script>
</body>
</html>
