<script>
const MY_GAS_URL = "https://script.google.com/macros/s/AKfycbxyC96mO15fHbbG11IVoWr7c_F63xAGYpYAhANVZGlmyCS43k-Gud26S5fmsIO-mBwy/exec";

let activities = [];
let db = JSON.parse(localStorage.getItem('stamina_v15_db')) || { groups: [{ id: 'default', name: '未分類人物', members: [] }] };
let monitors = JSON.parse(localStorage.getItem('stamina_v15_active')) || [];
let notifySettings = JSON.parse(localStorage.getItem('stamina_notify_cfg')) || { line: false, userId: "" };

window.onload = function() {
    const gameData = JSON.parse(sessionStorage.getItem('gameData'));
    if(!gameData) return location.href = "index.html";

    activities = gameData.activities;
    const select = document.getElementById('activitySelect');

    activities.forEach((act, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = act.name;
        select.appendChild(opt);
    });

    select.onchange = updateActivityInfo;
    select.dispatchEvent(new Event('change'));

    renderMonitoring();
    setInterval(renderMonitoring, 1000);
};

function updateActivityInfo(){
    const act = activities[activitySelect.value];
    const regain = act.regain || 1;

    document.getElementById('rateDetail').innerText =
        `${act.minPerStamina} 分鐘 / ${regain} 體`;

    document.getElementById('maxDetail').innerText =
        `${act.maxStamina} 體`;

    const fullMinutes = (act.maxStamina / regain) * act.minPerStamina;
    const hours = Math.floor(fullMinutes / 60);
    const mins = Math.floor(fullMinutes % 60);

    document.getElementById('fullTimeDetail').innerText =
        `${hours} 小時 ${mins} 分`;
}

function renderMonitoring() {
    const grid = document.getElementById('monitorGrid');
    const now = Date.now();

    grid.innerHTML = monitors.map(m => {
        const act = activities[m.actIdx];
        const mins = (now - m.startTime) / 60000;
        const regain = act.regain || 1;

        let current = Math.min(
            act.maxStamina,
            m.initStamina + Math.floor(mins / act.minPerStamina) * regain
        );

        return `
        <div class="card-standard p-6 rounded-3xl">
            <h4 class="font-black">${m.charName}</h4>
            <p>${current} / ${act.maxStamina}</p>
        </div>`;
    }).join('');
}

async function queueAdd(charId, charName, actIdx, initStamina) {

    if(!notifySettings.line || !notifySettings.userId) return;

    const act = activities[actIdx];
    const regain = act.regain || 1;

    const remain = act.maxStamina - initStamina;
    if(remain <= 0) return;

    const fullMinutes = (remain / regain) * act.minPerStamina;
    const targetTime = Date.now() + fullMinutes * 60000;

    await fetch(MY_GAS_URL, {
        method: "POST",
        body: JSON.stringify({
            action: "queueAdd",
            userId: notifySettings.userId,
            charId,
            charName,
            actName: act.name,
            targetTime
        })
    });
}

function submitBatch() {
    const actIdx = activitySelect.value;

    document.querySelectorAll('.char-cb:checked').forEach(cb => {
        const row = cb.closest('.flex');
        const val = parseInt(row.querySelector('.stamina-input').value) || 0;
        const charId = cb.dataset.id;

        const data = {
            charId,
            charName: cb.dataset.name,
            actIdx,
            initStamina: val,
            startTime: Date.now()
        };

        const idx = monitors.findIndex(m => m.charId === charId && m.actIdx == actIdx);
        if(idx > -1) monitors[idx] = data;
        else monitors.push(data);

        queueAdd(charId, cb.dataset.name, actIdx, val);
    });

    localStorage.setItem('stamina_v15_active', JSON.stringify(monitors));
    renderMonitoring();
}
</script>
