<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Stamina Test3</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#1e1e1e;
  color:#fff;
  margin:0;
  padding:20px;
}

.container{
  display:flex;
  gap:40px;
}

.left-panel{
  width:300px;
  background:#2b2b2b;
  padding:20px;
  border-radius:10px;
}

.right-panel{
  flex:1;
  background:#2b2b2b;
  padding:20px;
  border-radius:10px;
}

label{
  display:block;
  margin-top:15px;
  font-size:14px;
  color:#aaa;
}

select, button{
  width:100%;
  padding:8px;
  margin-top:5px;
  border-radius:6px;
  border:none;
  font-size:14px;
}

button{
  margin-top:20px;
  background:#4CAF50;
  color:white;
  cursor:pointer;
}

button:disabled{
  background:#666;
  cursor:not-allowed;
}

.info-block{
  margin-top:15px;
  font-size:14px;
  line-height:1.8em;
  color:#ddd;
}

.gray{
  opacity:0.5;
  pointer-events:none;
}
</style>
</head>

<body>

<h2>體力工具 - 測試版</h2>

<div class="container">

  <div class="left-panel">

    <label>選擇活動</label>
    <select id="activitySelect"></select>

    <div class="info-block">
      <div>恢復速率：<span id="recoveryRate">-</span></div>
      <div>體力上限：<span id="maxStamina">-</span></div>
      <div>回滿時長：<span id="fullTime">-</span></div>
    </div>

    <button id="startBtn">開始排程</button>

  </div>

  <div class="right-panel">
    <div id="statusText">狀態：待機中</div>
  </div>

</div>

<script>

const GAS_URL = "https://script.google.com/macros/s/AKfycbxyC96mO15fHbbG11IVoWr7c_F63xAGYpYAhANVZGlmyCS43k-Gud26S5fmsIO-mBwy/exec";

let gameData = null;

window.onload = function(){

  const raw = sessionStorage.getItem("gameData");
  if(!raw){
    alert("沒有登入資料");
    return;
  }

  gameData = JSON.parse(raw);

  initActivitySelect();
  bindEvents();
};

function initActivitySelect(){

  const select = document.getElementById("activitySelect");

  if(!gameData.activities || gameData.activities.length===0){
    select.innerHTML = "<option>沒有活動資料</option>";
    return;
  }

  gameData.activities.forEach(act=>{
    const opt = document.createElement("option");
    opt.value = act.name;
    opt.textContent = act.name;
    opt.dataset.recovery = act.recovery;
    opt.dataset.max = act.max;
    opt.dataset.full = act.fullTime;
    select.appendChild(opt);
  });

  updateActivityInfo();
}

function bindEvents(){

  document.getElementById("activitySelect")
    .addEventListener("change", updateActivityInfo);

  document.getElementById("startBtn")
    .addEventListener("click", startQueue);
}

function updateActivityInfo(){

  const select = document.getElementById("activitySelect");
  const opt = select.options[select.selectedIndex];

  if(!opt) return;

  document.getElementById("recoveryRate").textContent =
    opt.dataset.recovery + " 分 / " + "回體";

  document.getElementById("maxStamina").textContent =
    opt.dataset.max;

  document.getElementById("fullTime").textContent =
    opt.dataset.full || "-";
}

function startQueue(){

  const btn = document.getElementById("startBtn");
  const panel = document.querySelector(".left-panel");
  const status = document.getElementById("statusText");

  const activity = document.getElementById("activitySelect").value;

  btn.disabled = true;
  panel.classList.add("gray");
  status.textContent = "狀態：送出中...";

  fetch(GAS_URL,{
    method:"POST",
    body: JSON.stringify({
      action:"addQueue",
      userId: gameData.userId,
      charId: gameData.charId,
      charName: gameData.charName,
      activity: activity
    })
  })
  .then(r=>r.json())
  .then(res=>{
    status.textContent = "狀態：" + res.message;
  })
  .catch(err=>{
    status.textContent = "狀態：錯誤";
    console.error(err);
  })
  .finally(()=>{
    btn.disabled = false;
    panel.classList.remove("gray");
  });
}

</script>

</body>
</html>
