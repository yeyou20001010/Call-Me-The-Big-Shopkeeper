<script>
const MY_GAS_URL = "https://script.google.com/macros/s/AKfycbxyC96mO15fHbbG11IVoWr7c_F63xAGYpYAhANVZGlmyCS43k-Gud26S5fmsIO-mBwy/exec";

let activities = [];
let db = JSON.parse(localStorage.getItem('stamina_v15_db')) || { groups: [{ id: 'default', name: '未分類人物', members: [] }] };
let monitors = JSON.parse(localStorage.getItem('stamina_v15_active')) || [];
let sortMode = 0;
const sortTexts = ["按活動 (預設)", "按回滿時長", "按群組名稱", "按人物名稱"];
let notifySettings = JSON.parse(localStorage.getItem('stamina_notify_cfg')) || { line: false, userId: "" };

window.onload = function() {
    const gameData = JSON.parse(sessionStorage.getItem('gameData'));
    if(!gameData) return location.href = "index.html";

    activities = gameData.activities;
    const select = document.getElementById('activitySelect');

    activities.forEach((act, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = act.name;
        select.appendChild(opt);
    });

    select.onchange = updateActivityInfo;
    select.dispatchEvent(new Event('change'));

    document.getElementById('lineNotifyToggle').checked = notifySettings.line;
    document.getElementById('userIdInput').value = notifySettings.userId || "";

    renderMonitoring();
    setInterval(renderMonitoring, 1000);
};

function updateActivityInfo(){
    const act = activities[activitySelect.value];
    const regain = act.regain || 1;

    document.getElementById('rateDetail').innerText =
        `${act.minPerStamina} 分鐘 / ${regain} 體`;

    document.getElementById('maxDetail').innerText =
        `${act.maxStamina} 體`;

    const fullMinutes = (act.maxStamina / regain) * act.minPerStamina;
    const h = Math.floor(fullMinutes / 60);
    const m = Math.floor(fullMinutes % 60);

    let fullLabel = document.getElementById('fullTimeDetail');
    if(!fullLabel){
        const box = document.querySelector('#rateDetail').parentElement.parentElement;
        fullLabel = document.createElement('div');
        fullLabel.className="flex justify-between";
        fullLabel.innerHTML=`<span class="text-[#A5A5A5]">回滿時長</span><span id="fullTimeDetail" class="text-[#6D6875]"></span>`;
        box.appendChild(fullLabel);
        fullLabel = document.getElementById('fullTimeDetail');
    }
    fullLabel.innerText = `${h} 小時 ${m} 分`;
}

function renderMonitoring(){
    const grid = document.getElementById('monitorGrid');
    if(monitors.length === 0){
        grid.innerHTML="";
        document.getElementById('emptyDisplay').classList.remove('hidden');
        return;
    }
    document.getElementById('emptyDisplay').classList.add('hidden');

    const now = Date.now();
    let list = monitors.map(m=>{
        const act = activities[m.actIdx];
        const mins = (now - m.startTime)/60000;
        const rFactor = act.regain || 1;

        let current = Math.min(act.maxStamina,
            m.initStamina + Math.floor(mins/act.minPerStamina)*rFactor);

        const needed = act.maxStamina - current;
        const remSec = needed<=0?0:
            Math.ceil(needed/rFactor)*act.minPerStamina*60;

        return {...m,current,remSec,actName:act.name,actMax:act.maxStamina};
    });

    if(sortMode===0) list.sort((a,b)=>a.actName.localeCompare(b.actName));
    if(sortMode===1) list.sort((a,b)=>a.remSec-b.remSec);

    grid.innerHTML = list.map(m=>{
        const percent = (m.current/m.actMax)*100;
        const isFull = m.current>=m.actMax;
        const ringColor = isFull?'#02C874':'#FF9D6F';
        const targetTime = new Date(Date.now()+m.remSec*1000);

        return `
        <div class="card-standard p-8 rounded-[2.5rem] relative">
            <button onclick="removeMonitor('${m.charId}',${m.actIdx})" class="absolute top-6 right-8 text-2xl">✕</button>
            <h4 class="text-2xl font-black">${m.charName}</h4>
            <p>${m.current}/${m.actMax}</p>
            <p>${isFull?"體力已回滿":
                targetTime.getFullYear()+"/"+
                (targetTime.getMonth()+1)+"/"+
                targetTime.getDate()+" "+
                targetTime.getHours().toString().padStart(2,'0')+":"+
                targetTime.getMinutes().toString().padStart(2,'0')}
            </p>
        </div>`;
    }).join('');
}

async function queueAdd(charId,charName,actIdx,initStamina){
    if(!notifySettings.line || !notifySettings.userId) return;

    const act = activities[actIdx];
    const regain = act.regain||1;
    const remain = act.maxStamina-initStamina;
    if(remain<=0) return;

    const fullMinutes=(remain/regain)*act.minPerStamina;
    const targetTime=Date.now()+fullMinutes*60000;

    await fetch(MY_GAS_URL,{
        method:'POST',
        body:JSON.stringify({
            action:"queueAdd",
            userId:notifySettings.userId,
            charId,
            charName,
            actName:act.name,
            targetTime
        })
    });
}

function submitBatch(){
    const actIdx=activitySelect.value;
    document.querySelectorAll('.char-cb:checked').forEach(cb=>{
        const row=cb.closest('.flex');
        const val=parseInt(row.querySelector('.stamina-input').value)||0;
        const charId=cb.dataset.id;
        const data={charId,charName:cb.dataset.name,actIdx,initStamina:val,startTime:Date.now()};
        const idx=monitors.findIndex(m=>m.charId===charId&&m.actIdx==actIdx);
        if(idx>-1) monitors[idx]=data; else monitors.push(data);
        queueAdd(charId,cb.dataset.name,actIdx,val);
    });
    localStorage.setItem('stamina_v15_active',JSON.stringify(monitors));
    renderMonitoring();
}

function removeMonitor(charId,actIdx){
    monitors=monitors.filter(m=>!(m.charId===charId&&m.actIdx==actIdx));
    localStorage.setItem('stamina_v15_active',JSON.stringify(monitors));
    renderMonitoring();
}
</script>
